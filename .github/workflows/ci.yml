name: Floorp iOS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: floorp-ios-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  L10N_REVIEW_BASE: e58637e772e4456efcf7dbf3826f172c7da721ba
  L10N_REVIEWED: 9e46feb476739c508bb6d23a8ec92508d72adae0
  PROJECT_PATH: firefox-ios/Client.xcodeproj
  SCHEME: Fennec
  CONFIGURATION: Fennec_Testing
  SIMULATOR_NAME: iPhone 17
  SIMULATOR_OS: "26.2"
  UPSTREAM_REPOSITORY: https://github.com/mozilla-mobile/firefox-ios.git

jobs:
  workflow-lint:
    name: Validate workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check Floorp branding contracts
        run: ./scripts/ci/check-floorp-branding.sh
        env:
          # ubuntu runners don't guarantee ripgrep; exercise the portable path.
          FLOORP_BRANDING_SEARCH_BACKEND: grep

      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

  build-and-test:
    name: Build and unit test
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify Floorp localization overlay
        run: |
          node scripts/l10n/floorp-l10n-overlay.mjs extract \
            --base "$L10N_REVIEW_BASE" \
            --reviewed "$L10N_REVIEWED" \
            --check-counts \
            --check
          node --test scripts/l10n/__tests__/*.test.mjs

          git remote add upstream "$UPSTREAM_REPOSITORY" || git remote set-url upstream "$UPSTREAM_REPOSITORY"
          git fetch --no-tags upstream main
          upstream_source="$(git merge-base HEAD upstream/main)"
          node scripts/l10n/floorp-l10n-overlay.mjs verify --source-ref "$upstream_source"
          ./scripts/ci/test-rebrand-dry-run.sh

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Select Xcode
        run: |
          xcode_version="$(<.xcode-version)"
          sudo xcode-select --switch "/Applications/Xcode_${xcode_version}.app/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Bootstrap generated sources
        run: ./bootstrap.sh firefox
        env:
          CI: "true"

      - name: Audit Node.js dependencies
        run: npm audit --audit-level=high

      - name: Install SwiftLint
        if: github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'automation/upstream-sync')
        run: ./scripts/ci/install-swiftlint.sh "$RUNNER_TEMP/swiftlint"

      - name: Lint changed Swift files
        if: github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'automation/upstream-sync')
        run: ./scripts/ci/lint-changed-swift.sh "$RUNNER_TEMP/swiftlint/swiftlint" "$BASE_SHA" "$GITHUB_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -onlyUsePackageVersionsFromResolvedFile \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"

      - name: Prepare iOS Simulator
        timeout-minutes: 10
        run: |
          runtime="com.apple.CoreSimulator.SimRuntime.iOS-${SIMULATOR_OS//./-}"
          simulator_id="$(
            xcrun simctl list devices available --json \
              | jq -er --arg runtime "$runtime" --arg name "$SIMULATOR_NAME" \
                '.devices[$runtime] | map(select(.name == $name)) | first | .udid'
          )"
          simulator_arch="$(uname -m)"

          xcrun simctl bootstatus "$simulator_id" -b
          printf 'DESTINATION=platform=iOS Simulator,id=%s,arch=%s\n' \
            "$simulator_id" "$simulator_arch" >> "$GITHUB_ENV"
          printf 'Using %s (%s, %s)\n' "$SIMULATOR_NAME" "$simulator_id" "$simulator_arch"

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing -quiet \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "$DESTINATION" \
            -testPlan FloorpCI \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipMacroValidation \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY= \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/build.log"

      - name: Run unit tests
        timeout-minutes: 30
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "$DESTINATION" \
            -testPlan FloorpCI \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipMacroValidation \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 60 \
            -maximum-test-execution-time-allowance 120 \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -test-repetition-relaunch-enabled YES \
            -resultBundlePath "$RUNNER_TEMP/FloorpCI.xcresult" \
            CODE_SIGN_IDENTITY= \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/test.log"

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: floorp-ios-ci-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/test.log
            ${{ runner.temp }}/FloorpCI.xcresult
          if-no-files-found: ignore
          retention-days: 7
