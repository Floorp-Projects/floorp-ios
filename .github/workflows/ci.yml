name: Floorp iOS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_floorp_notes_sync_protected_preflight:
        description: Compile the protected Notes Sync G5 selector without executing it.
        required: false
        default: false
        type: boolean
      prepare_floorp_notes_sync_g5_contract:
        description: Validate the non-live G5 operation contract and compile its selector only.
        required: false
        default: false
        type: boolean
      run_floorp_notes_sync_production_qa:
        description: Run the protected two-account production Sync data-integrity QA matrix.
        required: false
        default: false
        type: boolean
      run_floorp_notes_sync_production_enablement:
        description: Record non-distributed production Sync enablement only after the QA matrix succeeds.
        required: false
        default: false
        type: boolean
      run_floorp_notes_sync_guarded_merge:
        description: Execute the protected OID-guarded Todo 20 squash merge and emit metadata-only merge evidence.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: >-
    floorp-ios-ci-${{ github.event_name }}-${{
    (inputs.run_floorp_notes_sync_protected_preflight == true ||
    inputs.prepare_floorp_notes_sync_g5_contract == true ||
    inputs.run_floorp_notes_sync_production_qa == true ||
    inputs.run_floorp_notes_sync_production_enablement == true ||
    inputs.run_floorp_notes_sync_guarded_merge == true) && github.run_id ||
    github.event.pull_request.number || github.ref }}
  cancel-in-progress: >-
    ${{ github.event_name != 'workflow_dispatch' ||
    (inputs.run_floorp_notes_sync_protected_preflight != true &&
    inputs.prepare_floorp_notes_sync_g5_contract != true &&
    inputs.run_floorp_notes_sync_production_qa != true &&
    inputs.run_floorp_notes_sync_production_enablement != true &&
    inputs.run_floorp_notes_sync_guarded_merge != true) }}

env:
  L10N_REVIEW_BASE: e58637e772e4456efcf7dbf3826f172c7da721ba
  L10N_REVIEWED: 9e46feb476739c508bb6d23a8ec92508d72adae0
  PROJECT_PATH: firefox-ios/Client.xcodeproj
  SCHEME: Fennec
  CONFIGURATION: Fennec_Testing
  SIMULATOR_NAME: iPhone 17
  SIMULATOR_OS: "26.2"
  UPSTREAM_REPOSITORY: https://github.com/mozilla-mobile/firefox-ios.git

jobs:
  workflow-lint:
    name: Validate workflows
    if: >-
      github.event_name != 'workflow_dispatch' || (
      inputs.run_floorp_notes_sync_protected_preflight != true &&
      inputs.prepare_floorp_notes_sync_g5_contract != true &&
      inputs.run_floorp_notes_sync_production_qa != true &&
      inputs.run_floorp_notes_sync_production_enablement != true &&
      inputs.run_floorp_notes_sync_guarded_merge != true)
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check Floorp branding contracts
        run: ./scripts/ci/check-floorp-branding.sh
        env:
          # ubuntu runners don't guarantee ripgrep; exercise the portable path.
          FLOORP_BRANDING_SEARCH_BACKEND: grep

      - name: Check Floorp Application Services pin
        run: |
          ./scripts/ci/check-application-services-pin.sh
          ./scripts/ci/test-application-services-pin-sync.sh

      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

  build-and-test:
    name: Build and unit test
    if: >-
      github.event_name != 'workflow_dispatch' || (
      inputs.run_floorp_notes_sync_protected_preflight != true &&
      inputs.prepare_floorp_notes_sync_g5_contract != true &&
      inputs.run_floorp_notes_sync_production_qa != true &&
      inputs.run_floorp_notes_sync_production_enablement != true &&
      inputs.run_floorp_notes_sync_guarded_merge != true)
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify Floorp localization overlay
        run: |
          node scripts/l10n/floorp-l10n-overlay.mjs extract \
            --base "$L10N_REVIEW_BASE" \
            --reviewed "$L10N_REVIEWED" \
            --check-counts \
            --check
          node --test scripts/l10n/__tests__/*.test.mjs

          git remote add upstream "$UPSTREAM_REPOSITORY" || git remote set-url upstream "$UPSTREAM_REPOSITORY"
          git fetch --no-tags upstream main
          upstream_source="$(git merge-base HEAD upstream/main)"
          node scripts/l10n/floorp-l10n-overlay.mjs verify --source-ref "$upstream_source"
          ./scripts/ci/test-rebrand-dry-run.sh

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Run Floorp release contract tests
        run: |
          env -u GITHUB_API_URL -u GITHUB_SERVER_URL \
            python3 -m unittest discover -s scripts/ci/tests -p 'test_*.py'
          env -u GITHUB_API_URL -u GITHUB_SERVER_URL \
            python3 -m unittest discover -s scripts/staging/tests -p 'test_*.py'

      - name: Select Xcode
        run: |
          xcode_version="$(<.xcode-version)"
          sudo xcode-select --switch "/Applications/Xcode_${xcode_version}.app/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Bootstrap generated sources
        run: ./bootstrap.sh firefox
        env:
          CI: "true"

      - name: Audit Node.js dependencies
        run: npm audit --audit-level=high

      - name: Install SwiftLint
        if: github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'automation/upstream-sync')
        run: ./scripts/ci/install-swiftlint.sh "$RUNNER_TEMP/swiftlint"

      - name: Lint changed Swift files
        if: github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'automation/upstream-sync')
        run: ./scripts/ci/lint-changed-swift.sh "$RUNNER_TEMP/swiftlint/swiftlint" "$BASE_SHA" "$GITHUB_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -onlyUsePackageVersionsFromResolvedFile \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"

      - name: Prepare iOS Simulator
        timeout-minutes: 10
        run: |
          runtime="com.apple.CoreSimulator.SimRuntime.iOS-${SIMULATOR_OS//./-}"
          simulator_id="$(
            xcrun simctl list devices available --json \
              | jq -er --arg runtime "$runtime" --arg name "$SIMULATOR_NAME" \
                '.devices[$runtime] | map(select(.name == $name)) | first | .udid'
          )"
          simulator_arch="$(uname -m)"

          xcrun simctl bootstatus "$simulator_id" -b
          printf 'DESTINATION=platform=iOS Simulator,id=%s,arch=%s\n' \
            "$simulator_id" "$simulator_arch" >> "$GITHUB_ENV"
          printf 'Using %s (%s, %s)\n' "$SIMULATOR_NAME" "$simulator_id" "$simulator_arch"

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing -quiet \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "$DESTINATION" \
            -testPlan FloorpCI \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipMacroValidation \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY= \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/build.log"

      # Compile only: normal PR/main CI has no production-QA authorization,
      # credentials, or G5 evidence role.
      - name: Compile release-disabled G5 XCTest route
        run: |
          set -o pipefail
          xcodebuild build-for-testing -quiet \
            -project "$PROJECT_PATH" \
            -scheme FloorpNotesSyncG5 \
            -configuration FloorpRelease \
            -destination "$DESTINATION" \
            -testPlan FloorpNotesSyncG5 \
            -only-testing:XCUITests/FloorpNotesSyncTwoClientMatrixTests/testTwoClientProductionMatrix \
            -derivedDataPath "$RUNNER_TEMP/G5RouteCompileDerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipMacroValidation \
            -parallel-testing-enabled NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY= \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/g5-route-compile.log"

      - name: Run unit tests
        timeout-minutes: 30
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "$DESTINATION" \
            -testPlan FloorpCI \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipMacroValidation \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 60 \
            -maximum-test-execution-time-allowance 120 \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -test-repetition-relaunch-enabled YES \
            -resultBundlePath "$RUNNER_TEMP/FloorpCI.xcresult" \
            CODE_SIGN_IDENTITY= \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/test.log"

          if grep -Fq \
            "Fatal error: No definition registered for type:" \
            "$RUNNER_TEMP/test.log"; then
            echo "::error::Unit-test host resolved an AppContainer dependency after teardown"
            exit 1
          fi

      - name: Upload Notes Sync G3 result
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: floorp-notes-sync-xcresult
          path: ${{ runner.temp }}/FloorpCI.xcresult
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: floorp-ios-ci-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/test.log
            ${{ runner.temp }}/FloorpCI.xcresult
          if-no-files-found: ignore
          retention-days: 7

  release-disabled-wrapper:
    name: Release-disabled wrapper build
    if: >-
      github.event_name != 'workflow_dispatch' || (
      inputs.run_floorp_notes_sync_protected_preflight != true &&
      inputs.prepare_floorp_notes_sync_g5_contract != true &&
      inputs.run_floorp_notes_sync_production_qa != true &&
      inputs.run_floorp_notes_sync_production_enablement != true &&
      inputs.run_floorp_notes_sync_guarded_merge != true)
    runs-on: macos-26
    timeout-minutes: 90
    needs: workflow-lint

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          xcode_version="$(<.xcode-version)"
          sudo xcode-select --switch "/Applications/Xcode_${xcode_version}.app/Contents/Developer"
          xcodebuild -version

      - name: Run release-disabled wrapper
        run: |
          ./scripts/staging/build-floorp-notes-sync-ios.sh \
            --mode release-disabled \
            --source-sha "$GITHUB_SHA" \
            --output-dir "$RUNNER_TEMP/floorp-notes-sync-release-disabled" \
            --manifest "$RUNNER_TEMP/floorp-notes-sync-release-disabled-manifest.json"

      - name: Upload release-disabled diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: floorp-ios-release-disabled-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/floorp-notes-sync-release-disabled/contract-inputs
            ${{ runner.temp }}/floorp-notes-sync-release-disabled/xcodebuild.log
            ${{ runner.temp }}/floorp-notes-sync-release-disabled-manifest.json
          if-no-files-found: ignore
          retention-days: 7

  # This Environment-bound job is a manual scheduling preflight only. It
  # compiles the guard XCTest without executing it and must not be treated as
  # G5 evidence or execution authorization.
  notes-sync-protected-preflight:
    name: Protected Notes Sync compile-only preflight
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.run_floorp_notes_sync_protected_preflight == true &&
      inputs.prepare_floorp_notes_sync_g5_contract != true &&
      inputs.run_floorp_notes_sync_production_qa != true &&
      inputs.run_floorp_notes_sync_production_enablement != true &&
      inputs.run_floorp_notes_sync_guarded_merge != true
    environment: floorp-notes-sync-production-qa
    # Override the workflow-wide read permission. This job must not receive a
    # usable GitHub token or invoke a token-defaulting source checkout action.
    permissions: {}
    env:
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
      NODE_AUTH_TOKEN: ""
      NPM_TOKEN: ""
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_TERMINAL_PROMPT: "0"
      GIT_ASKPASS: /usr/bin/false
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Check out source anonymously
        run: |
          set -euo pipefail
          git -C "$GITHUB_WORKSPACE" init --quiet
          git -C "$GITHUB_WORKSPACE" \
            -c credential.helper= \
            -c http.https://github.com/.extraheader= \
            remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" \
            -c credential.helper= \
            -c http.https://github.com/.extraheader= \
            fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach --force FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          token: ""
          package-manager-cache: false

      - name: Select Xcode
        run: |
          xcode_version="$(<.xcode-version)"
          sudo xcode-select --switch "/Applications/Xcode_${xcode_version}.app/Contents/Developer"
          xcodebuild -version

      - name: Bootstrap generated sources
        run: ./bootstrap.sh firefox
        env:
          CI: "true"

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT_PATH" \
            -scheme FloorpNotesSyncG5 \
            -onlyUsePackageVersionsFromResolvedFile \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"

      - name: Prepare iOS Simulator
        timeout-minutes: 10
        run: |
          runtime="com.apple.CoreSimulator.SimRuntime.iOS-${SIMULATOR_OS//./-}"
          simulator_id="$(
            xcrun simctl list devices available --json \
              | jq -er --arg runtime "$runtime" --arg name "$SIMULATOR_NAME" \
                '.devices[$runtime] | map(select(.name == $name)) | first | .udid'
          )"
          simulator_arch="$(uname -m)"

          xcrun simctl bootstatus "$simulator_id" -b
          printf 'DESTINATION=platform=iOS Simulator,id=%s,arch=%s\n' \
            "$simulator_id" "$simulator_arch" >> "$GITHUB_ENV"

      - name: Compile protected G5 XCTest route
        run: |
          set -o pipefail
          xcodebuild build-for-testing -quiet \
            -project "$PROJECT_PATH" \
            -scheme FloorpNotesSyncG5 \
            -configuration FloorpRelease \
            -destination "$DESTINATION" \
            -testPlan FloorpNotesSyncG5 \
            -only-testing:XCUITests/FloorpNotesSyncTwoClientMatrixTests/testTwoClientProductionMatrix \
            -derivedDataPath "$RUNNER_TEMP/ProtectedG5PreflightDerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipMacroValidation \
            -parallel-testing-enabled NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY= \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/protected-g5-preflight-compile.log"

  # This Environment-bound job validates the checked-in Todo 20 contract and
  # compiles the guard selector only. It is not Phase 1 QA and receives no
  # account secrets.
  notes-sync-g5-operation-contract-preflight:
    name: Todo 20 operation-contract compile preflight
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.prepare_floorp_notes_sync_g5_contract == true &&
      inputs.run_floorp_notes_sync_protected_preflight != true &&
      inputs.run_floorp_notes_sync_production_qa != true &&
      inputs.run_floorp_notes_sync_production_enablement != true &&
      inputs.run_floorp_notes_sync_guarded_merge != true
    environment: floorp-notes-sync-production-qa
    permissions: {}
    env:
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
      NODE_AUTH_TOKEN: ""
      NPM_TOKEN: ""
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_TERMINAL_PROMPT: "0"
      GIT_ASKPASS: /usr/bin/false
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Check out source anonymously
        run: |
          set -euo pipefail
          git -C "$GITHUB_WORKSPACE" init --quiet
          git -C "$GITHUB_WORKSPACE" \
            -c credential.helper= \
            -c http.https://github.com/.extraheader= \
            remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" \
            -c credential.helper= \
            -c http.https://github.com/.extraheader= \
            fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach --force FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          token: ""
          package-manager-cache: false

      - name: Validate non-live G5 operation contract
        run: |
          /usr/bin/python3 -I scripts/ci/validate-floorp-notes-sync-g5-operation-contract.py \
            --contract scripts/ci/floorp-notes-sync-g5-operation-contract.json

      - name: Select Xcode
        run: |
          xcode_version="$(<.xcode-version)"
          sudo xcode-select --switch "/Applications/Xcode_${xcode_version}.app/Contents/Developer"
          xcodebuild -version

      - name: Bootstrap generated sources
        run: ./bootstrap.sh firefox
        env:
          CI: "true"

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT_PATH" \
            -scheme FloorpNotesSyncG5 \
            -onlyUsePackageVersionsFromResolvedFile \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"

      - name: Compile non-live G5 XCTest route
        run: |
          set -o pipefail
          xcodebuild build-for-testing -quiet \
            -project "$PROJECT_PATH" \
            -scheme FloorpNotesSyncG5 \
            -configuration FloorpRelease \
            -destination 'generic/platform=iOS Simulator' \
            -testPlan FloorpNotesSyncG5 \
            -only-testing:XCUITests/FloorpNotesSyncTwoClientMatrixTests/testTwoClientProductionMatrix \
            -derivedDataPath "$RUNNER_TEMP/OperationContractG5CompileDerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipMacroValidation \
            -parallel-testing-enabled NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY= \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/operation-contract-g5-compile.log"

  todo20-guarded-merge:
    name: Todo 20 protected OID-guarded merge and audit receipt
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/agent/floorp-plan-t20-live-executor' &&
      inputs.run_floorp_notes_sync_guarded_merge == true &&
      inputs.run_floorp_notes_sync_protected_preflight != true &&
      inputs.prepare_floorp_notes_sync_g5_contract != true &&
      inputs.run_floorp_notes_sync_production_qa != true &&
      inputs.run_floorp_notes_sync_production_enablement != true
    environment: floorp-notes-sync-production-qa
    permissions: {}
    runs-on: macos-26
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ""
      GH_TOKEN: ${{ secrets.FLOORP_TODO20_GH_MERGE_TOKEN }}
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_TERMINAL_PROMPT: "0"
      GIT_ASKPASS: /usr/bin/false
      FLOORP_TODO20_PR_NUMBER: ${{ vars.FLOORP_TODO20_PR_NUMBER }}
      FLOORP_TODO20_EXPECTED_HEAD_SHA: ${{ vars.FLOORP_TODO20_EXPECTED_HEAD_SHA }}

    steps:
      - name: Check out source anonymously
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: |
          set -euo pipefail
          git -C "$GITHUB_WORKSPACE" init --quiet
          git -C "$GITHUB_WORKSPACE" \
            -c credential.helper= \
            -c http.https://github.com/.extraheader= \
            remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" \
            -c credential.helper= \
            -c http.https://github.com/.extraheader= \
            fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach --force FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Check guarded merge prerequisites
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || {
            printf '%s\n' '[blocked] AUTHORIZATION_MISSING owner=Operations reason=guarded_merge_token_missing resume=configure protected Environment secret FLOORP_TODO20_GH_MERGE_TOKEN with pull-request merge authority' >&2
            exit 78
          }
          test -n "$FLOORP_TODO20_PR_NUMBER"
          test "$GITHUB_SHA" = "$FLOORP_TODO20_EXPECTED_HEAD_SHA" || {
            printf '%s\n' '[blocked] EXTERNAL_REVIEW_PENDING owner=Operations reason=guarded_merge_expected_head_mismatch resume=update protected expected head only after exact-head CI and subagent GO' >&2
            exit 78
          }

      - name: Execute repository-owned OID-guarded merge
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/floorp-notes-sync-guarded-merge"
          install -d -m 700 "$root"
          /usr/bin/python3 -I scripts/ci/execute-floorp-notes-sync-merge.py \
            --pr-number "$FLOORP_TODO20_PR_NUMBER" \
            --expected-head-sha "$FLOORP_TODO20_EXPECTED_HEAD_SHA" \
            --output "$root/merge-operation-receipt.json"
          printf 'FLOORP_TODO20_MERGE_ROOT=%s\n' "$root" >> "$GITHUB_ENV"

      - name: Capture protected organization audit response
        env:
          FLOORP_TODO20_GH_AUDIT_TOKEN: ${{ secrets.FLOORP_TODO20_GH_AUDIT_TOKEN }}
          GH_TOKEN: ${{ secrets.FLOORP_TODO20_GH_AUDIT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${FLOORP_TODO20_GH_AUDIT_TOKEN:-}" || {
            printf '%s\n' '[blocked] AUTHORIZATION_MISSING owner=Operations reason=github_org_audit_log_secret_missing resume=configure protected Environment secret FLOORP_TODO20_GH_AUDIT_TOKEN with read-only organization audit-log authority' >&2
            exit 78
          }
          /opt/homebrew/bin/gh api --paginate --slurp \
            "orgs/Floorp-Projects/audit-log?phrase=repo%3AFloorp-Projects%2Ffloorp-ios&per_page=100" \
            -H "Accept: application/vnd.github+json" \
            > "$FLOORP_TODO20_MERGE_ROOT/audit-log.json"

      - name: Create same-run metadata-only merge audit
        run: |
          set -euo pipefail
          /usr/bin/python3 -I scripts/ci/create-floorp-notes-sync-merge-audit.py \
            --operation-receipt "$FLOORP_TODO20_MERGE_ROOT/merge-operation-receipt.json" \
            --audit-json "$FLOORP_TODO20_MERGE_ROOT/audit-log.json" \
            --output "$FLOORP_TODO20_MERGE_ROOT/merge-audit.json"

      - name: Upload immutable guarded-merge metadata
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: floorp-notes-sync-guarded-merge-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/floorp-notes-sync-guarded-merge/merge-audit.json
            ${{ runner.temp }}/floorp-notes-sync-guarded-merge/merge-operation-receipt.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove guarded-merge runner-local material
        if: always()
        run: |
          set -euo pipefail
          /usr/bin/python3 -I scripts/ci/cleanup-floorp-notes-sync-production-qa.py \
            --work-root "$RUNNER_TEMP/floorp-notes-sync-guarded-merge"

  notes-sync-production-qa:
    name: Todo 20 protected two-client production QA
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.run_floorp_notes_sync_production_qa == true
    environment: floorp-notes-sync-production-qa
    permissions: {}
    runs-on: macos-26
    timeout-minutes: 180
    env:
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
      NODE_AUTH_TOKEN: ""
      NPM_TOKEN: ""
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_TERMINAL_PROMPT: "0"
      GIT_ASKPASS: /usr/bin/false
      # Updated only after the reviewed Desktop UI-hook PR is squash-merged.
      FLOORP_DESKTOP_COMMIT: 8462074ce18ab63d9be4def199b33de1d6bb554a
      FLOORP_TODO20_PR_NUMBER: ${{ vars.FLOORP_TODO20_PR_NUMBER }}
      # Metadata-only review inputs. Their source is verified against the
      # read-only GitHub PR/ruleset API, checked-in contract/binding, and
      # protected Environment review artifacts.
      FLOORP_TODO20_OWNER_REVIEW_JSON: ${{ vars.FLOORP_TODO20_OWNER_REVIEW_JSON }}
      FLOORP_TODO20_MERGE_AUDIT_COMMIT: ${{ vars.FLOORP_TODO20_MERGE_AUDIT_COMMIT }}
      FLOORP_TODO20_SUBAGENT_REVIEW_COMMIT: ${{ vars.FLOORP_TODO20_SUBAGENT_REVIEW_COMMIT }}

    steps:
      - name: Check out source anonymously
        run: |
          set -euo pipefail
          git -C "$GITHUB_WORKSPACE" init --quiet
          git -C "$GITHUB_WORKSPACE" \
            -c credential.helper= \
            -c http.https://github.com/.extraheader= \
            remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" \
            -c credential.helper= \
            -c http.https://github.com/.extraheader= \
            fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach --force FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Capture source-bound Todo 20 review receipt
        env:
          FLOORP_TODO20_GH_AUDIT_TOKEN: ${{ secrets.FLOORP_TODO20_GH_AUDIT_TOKEN }}
          GH_TOKEN: ${{ secrets.FLOORP_TODO20_GH_AUDIT_TOKEN }}
        run: |
          set -euo pipefail
          qa_root="$RUNNER_TEMP/floorp-notes-sync-production-qa"
          install -d -m 700 "$qa_root"
          if [ -z "${FLOORP_TODO20_GH_AUDIT_TOKEN:-}" ]; then
            printf '%s\n' '[blocked] AUTHORIZATION_MISSING owner=Operations reason=github_org_audit_log_secret_missing resume=configure protected Environment secret FLOORP_TODO20_GH_AUDIT_TOKEN with read-only organization audit-log authority' >&2
            exit 78
          fi
          test -n "$FLOORP_TODO20_PR_NUMBER"
          test -n "$FLOORP_TODO20_OWNER_REVIEW_JSON"
          test -n "$FLOORP_TODO20_MERGE_AUDIT_COMMIT"
          test -n "$FLOORP_TODO20_SUBAGENT_REVIEW_COMMIT"
          curl --fail --silent --show-error --location --retry 3 \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$FLOORP_TODO20_PR_NUMBER" \
            -H "Accept: application/vnd.github+json" \
            -o "$qa_root/pr.json"
          curl --fail --silent --show-error --location --retry 3 \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$FLOORP_TODO20_PR_NUMBER/reviews" \
            -H "Accept: application/vnd.github+json" \
            -o "$qa_root/reviews.json"
          curl --fail --silent --show-error --location --retry 3 \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/rulesets/20229460" \
            -H "Accept: application/vnd.github+json" \
            -o "$qa_root/ruleset.json"
          /opt/homebrew/bin/gh api --paginate --slurp \
            "orgs/Floorp-Projects/audit-log?phrase=repo%3AFloorp-Projects%2Ffloorp-ios&per_page=100" \
            -H "Accept: application/vnd.github+json" \
            > "$qa_root/audit-log.json"
          base_oid="$(/usr/bin/python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["base"]["sha"])' "$qa_root/pr.json")"
          head_oid="$(/usr/bin/python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["head"]["sha"])' "$qa_root/pr.json")"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$base_oid" "$head_oid"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$FLOORP_TODO20_SUBAGENT_REVIEW_COMMIT"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$FLOORP_TODO20_MERGE_AUDIT_COMMIT"
          git -C "$GITHUB_WORKSPACE" cat-file -e "$FLOORP_TODO20_SUBAGENT_REVIEW_COMMIT^{commit}"
          git -C "$GITHUB_WORKSPACE" cat-file -e "$FLOORP_TODO20_MERGE_AUDIT_COMMIT^{commit}"
          printf "%s\n" "$FLOORP_TODO20_OWNER_REVIEW_JSON" > "$qa_root/owner-review.json"
          git -C "$GITHUB_WORKSPACE" show "$FLOORP_TODO20_MERGE_AUDIT_COMMIT:docs/floorp-notes-sync-todo20-merge-audit.json" > "$qa_root/merge-audit.json"
          git -C "$GITHUB_WORKSPACE" show "$FLOORP_TODO20_SUBAGENT_REVIEW_COMMIT:docs/floorp-notes-sync-todo20-subagent-review.json" > "$qa_root/subagent-review.json"
          /usr/bin/python3 -I scripts/ci/capture-floorp-notes-sync-review-receipt.py \
            --pr-json "$qa_root/pr.json" \
            --reviews-json "$qa_root/reviews.json" \
            --ruleset-json "$qa_root/ruleset.json" \
            --repository-root "$GITHUB_WORKSPACE" \
            --pr-number "$FLOORP_TODO20_PR_NUMBER" \
            --merged-oid "$GITHUB_SHA" \
            --desktop-sha "$FLOORP_DESKTOP_COMMIT" \
            --contract scripts/ci/floorp-notes-sync-g5-operation-contract.json \
            --plan-binding docs/floorp-notes-sync-todo20-plan-binding.json \
            --owner-review "$qa_root/owner-review.json" \
            --merge-audit "$qa_root/merge-audit.json" \
            --merge-audit-commit "$FLOORP_TODO20_MERGE_AUDIT_COMMIT" \
            --audit-json "$qa_root/audit-log.json" \
            --subagent-review "$qa_root/subagent-review.json" \
            --subagent-review-commit "$FLOORP_TODO20_SUBAGENT_REVIEW_COMMIT" \
            --pr-projection "$qa_root/pr-metadata.json" \
            --reviews-projection "$qa_root/reviews-metadata.json" \
            --ruleset-projection "$qa_root/ruleset-metadata.json" \
            --output "$qa_root/review-receipt.json"
          printf "FLOORP_NOTES_SYNC_REVIEW_RECEIPT=%s\n" "$qa_root/review-receipt.json" >> "$GITHUB_ENV"

      - name: Check out reviewed Desktop source anonymously
        run: |
          set -euo pipefail
          desktop_root="$RUNNER_TEMP/floorp-desktop"
          git init --quiet "$desktop_root"
          git -C "$desktop_root" \
            -c credential.helper= \
            -c http.https://github.com/.extraheader= \
            remote add origin https://github.com/Floorp-Projects/Floorp.git
          git -C "$desktop_root" \
            -c credential.helper= \
            -c http.https://github.com/.extraheader= \
            fetch --no-tags --depth=1 origin "$FLOORP_DESKTOP_COMMIT"
          git -C "$desktop_root" checkout --detach --force FETCH_HEAD
          test "$(git -C "$desktop_root" rev-parse HEAD)" = "$FLOORP_DESKTOP_COMMIT"
          printf 'FLOORP_NOTES_SYNC_DESKTOP_ROOT=%s\n' "$desktop_root" >> "$GITHUB_ENV"

      - name: Validate Todo 20 contract semantics in protected QA path
        run: |
          set -euo pipefail
          /usr/bin/python3 -I scripts/ci/validate-floorp-notes-sync-g5-operation-contract.py \
            --contract scripts/ci/floorp-notes-sync-g5-operation-contract.json

      - name: Create protected Todo 20 production-QA capability
        run: |
          set -euo pipefail
          qa_root="$RUNNER_TEMP/floorp-notes-sync-production-qa"
          install -d -m 700 "$qa_root"
          capability="$qa_root/production-qa-capability.json"
          xcconfig="$qa_root/production-qa.xcconfig"
          /usr/bin/python3 -I scripts/ci/create-floorp-notes-sync-production-qa-capability.py \
            --contract scripts/ci/floorp-notes-sync-g5-operation-contract.json \
            --endpoint-policy docs/floorp-release-endpoints.json \
            --desktop-sha "$FLOORP_DESKTOP_COMMIT" \
            --ios-build-number 4 \
            --output "$capability"
          /usr/bin/python3 -I scripts/ci/validate-floorp-notes-sync-production-qa-capability.py \
            --capability "$capability" \
            --source-sha "$GITHUB_SHA" \
            --desktop-sha "$FLOORP_DESKTOP_COMMIT" \
            --contract scripts/ci/floorp-notes-sync-g5-operation-contract.json \
            --endpoint-policy docs/floorp-release-endpoints.json
          /usr/bin/python3 -I scripts/ci/prepare-floorp-notes-sync-production-qa-build.py \
            --capability "$capability" \
            --source-sha "$GITHUB_SHA" \
            --desktop-sha "$FLOORP_DESKTOP_COMMIT" \
            --contract scripts/ci/floorp-notes-sync-g5-operation-contract.json \
            --endpoint-policy docs/floorp-release-endpoints.json \
            --output "$xcconfig"
          {
            printf 'FLOORP_NOTES_SYNC_QA_ROOT=%s\n' "$qa_root"
            printf 'FLOORP_NOTES_SYNC_QA_CAPABILITY=%s\n' "$capability"
            printf 'FLOORP_NOTES_SYNC_QA_XCCONFIG=%s\n' "$xcconfig"
          } >> "$GITHUB_ENV"

      - name: Select Xcode
        run: |
          xcode_version="$(<.xcode-version)"
          sudo xcode-select --switch "/Applications/Xcode_${xcode_version}.app/Contents/Developer"
          xcodebuild -version

      - name: Bootstrap generated sources
        run: ./bootstrap.sh firefox
        env:
          CI: "true"

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT_PATH" \
            -scheme FloorpNotesSyncG5 \
            -onlyUsePackageVersionsFromResolvedFile \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"

      - name: Prepare dedicated QA Simulator
        run: |
          set -euo pipefail
          runtime="com.apple.CoreSimulator.SimRuntime.iOS-${SIMULATOR_OS//./-}"
          simulator_id="$(
            xcrun simctl list devices available --json \
              | jq -er --arg runtime "$runtime" --arg name "$SIMULATOR_NAME" \
                '.devices[$runtime] | map(select(.name == $name)) | first | .udid'
          )"
          simulator_arch="$(uname -m)"
          xcrun simctl boot "$simulator_id" 2>/dev/null || true
          xcrun simctl bootstatus "$simulator_id" -b
          printf 'FLOORP_NOTES_SYNC_QA_SIMULATOR_UDID=%s\n' "$simulator_id" >> "$GITHUB_ENV"
          printf 'FLOORP_NOTES_SYNC_QA_DESTINATION=platform=iOS Simulator,id=%s,arch=%s\n' \
            "$simulator_id" "$simulator_arch" >> "$GITHUB_ENV"

      - name: Run protected two-client integrity QA
        id: client-pair
        env:
          FLOORP_NOTES_SYNC_ACCOUNT_A_EMAIL: ${{ secrets.FLOORP_NOTES_SYNC_ACCOUNT_A_EMAIL }}
          FLOORP_NOTES_SYNC_ACCOUNT_A_PASSWORD: ${{ secrets.FLOORP_NOTES_SYNC_ACCOUNT_A_PASSWORD }}
          FLOORP_NOTES_SYNC_ACCOUNT_B_EMAIL: ${{ secrets.FLOORP_NOTES_SYNC_ACCOUNT_B_EMAIL }}
          FLOORP_NOTES_SYNC_ACCOUNT_B_PASSWORD: ${{ secrets.FLOORP_NOTES_SYNC_ACCOUNT_B_PASSWORD }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -I scripts/ci/run-floorp-notes-sync-production-qa.py \
            --summary "$FLOORP_NOTES_SYNC_QA_ROOT/qa-summary.json" \
            --cleanup-receipt "$FLOORP_NOTES_SYNC_QA_ROOT/cleanup-receipt.json" \
            --desktop-log "$FLOORP_NOTES_SYNC_QA_ROOT/desktop.log" \
            --xcodebuild-log "$FLOORP_NOTES_SYNC_QA_ROOT/xcodebuild.log" \
            --client-state "$FLOORP_NOTES_SYNC_QA_ROOT/client-state" \
            --desktop-root "$FLOORP_NOTES_SYNC_DESKTOP_ROOT" \
            --desktop-sha "$FLOORP_DESKTOP_COMMIT" \
            --simulator-udid "$FLOORP_NOTES_SYNC_QA_SIMULATOR_UDID" \
            --coordination-root "/tmp/floorp-notes-sync-production-qa-$GITHUB_RUN_ID" \
            --ios-project "$GITHUB_WORKSPACE/$PROJECT_PATH" \
            --destination "$FLOORP_NOTES_SYNC_QA_DESTINATION" \
            --derived-data "$FLOORP_NOTES_SYNC_QA_ROOT/DerivedData" \
            --source-packages "$RUNNER_TEMP/SourcePackages" \
            --xcconfig "$FLOORP_NOTES_SYNC_QA_XCCONFIG" \
            --result-bundle "$FLOORP_NOTES_SYNC_QA_ROOT/floorp-notes-sync-two-client.xcresult"

      - name: Validate live production-QA summary and cleanup receipt
        if: success()
        run: |
          set -euo pipefail
          /usr/bin/python3 -I scripts/ci/validate-floorp-notes-sync-production-qa.py \
            --summary "$FLOORP_NOTES_SYNC_QA_ROOT/qa-summary.json" \
            --xcresult "$FLOORP_NOTES_SYNC_QA_ROOT/floorp-notes-sync-two-client.xcresult"
          /usr/bin/python3 -I scripts/ci/validate-floorp-notes-sync-production-qa-cleanup.py \
            --summary "$FLOORP_NOTES_SYNC_QA_ROOT/qa-summary.json" \
            --receipt "$FLOORP_NOTES_SYNC_QA_ROOT/cleanup-receipt.json"

      - name: Scan QA material for secrets
        if: always()
        env:
          FLOORP_NOTES_SYNC_ACCOUNT_A_EMAIL: ${{ secrets.FLOORP_NOTES_SYNC_ACCOUNT_A_EMAIL }}
          FLOORP_NOTES_SYNC_ACCOUNT_A_PASSWORD: ${{ secrets.FLOORP_NOTES_SYNC_ACCOUNT_A_PASSWORD }}
          FLOORP_NOTES_SYNC_ACCOUNT_B_EMAIL: ${{ secrets.FLOORP_NOTES_SYNC_ACCOUNT_B_EMAIL }}
          FLOORP_NOTES_SYNC_ACCOUNT_B_PASSWORD: ${{ secrets.FLOORP_NOTES_SYNC_ACCOUNT_B_PASSWORD }}
          FLOORP_TODO20_GH_AUDIT_TOKEN: ${{ secrets.FLOORP_TODO20_GH_AUDIT_TOKEN }}
        run: |
          set -euo pipefail
          qa_root="$RUNNER_TEMP/floorp-notes-sync-production-qa"
          # The protected xcodebuild actor receives secrets through its
          # Environment. Scan command lines only so variable names are not
          # mistaken for leaked credential values.
          /usr/bin/python3 -I scripts/ci/scan-floorp-notes-sync-process-argv.py
          /usr/bin/python3 -I scripts/ci/record-floorp-notes-sync-secret-scan.py \
            --output "$qa_root/secret-scan-pre.json" \
            --target "$qa_root/qa-summary.json" \
            --target "$qa_root/cleanup-receipt.json" \
            --target "$qa_root/floorp-notes-sync-two-client.xcresult" \
            --target "$qa_root/xcodebuild.log" \
            --target "$qa_root/desktop.log" \
            --target "$qa_root/production-qa-capability.json" \
            --target "$qa_root/production-qa.xcconfig" \
            --target "$FLOORP_NOTES_SYNC_REVIEW_RECEIPT" \
            --target "$qa_root/pr-metadata.json" \
            --target "$qa_root/reviews-metadata.json" \
            --target "$qa_root/ruleset-metadata.json" \
            --secret-env FLOORP_NOTES_SYNC_ACCOUNT_A_EMAIL \
            --secret-env FLOORP_NOTES_SYNC_ACCOUNT_A_PASSWORD \
            --secret-env FLOORP_NOTES_SYNC_ACCOUNT_B_EMAIL \
            --secret-env FLOORP_NOTES_SYNC_ACCOUNT_B_PASSWORD \
            --secret-env FLOORP_TODO20_GH_AUDIT_TOKEN

      - name: Bind evidence manifest and single-operator self-attestation
        if: success()
        run: |
          set -euo pipefail
          qa_root="$RUNNER_TEMP/floorp-notes-sync-production-qa"
          manifest="$qa_root/qa-manifest.json"
          /usr/bin/python3 -I scripts/ci/create-floorp-notes-sync-production-qa-manifest.py \
            --output "$manifest" \
            --source-sha "$GITHUB_SHA" \
            --desktop-sha "$FLOORP_DESKTOP_COMMIT" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --qa-summary "$qa_root/qa-summary.json" \
            --cleanup-receipt "$qa_root/cleanup-receipt.json" \
            --xcresult "$qa_root/floorp-notes-sync-two-client.xcresult" \
            --xcodebuild-log "$qa_root/xcodebuild.log" \
            --desktop-log "$qa_root/desktop.log" \
            --production-qa-capability "$qa_root/production-qa-capability.json" \
            --production-qa-xcconfig "$qa_root/production-qa.xcconfig" \
            --secret-scan "$qa_root/secret-scan-pre.json" \
            --review-receipt "$qa_root/review-receipt.json" \
            --pr-metadata "$qa_root/pr-metadata.json" \
            --reviews-metadata "$qa_root/reviews-metadata.json" \
            --ruleset-metadata "$qa_root/ruleset-metadata.json"
          /usr/bin/python3 -I scripts/ci/validate-floorp-notes-sync-secret-scan.py \
            --receipt "$qa_root/secret-scan-pre.json" \
            --head-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --manifest "$manifest" \
            --pre-attestation \
            --target "$qa_root/qa-summary.json" \
            --target "$qa_root/cleanup-receipt.json" \
            --target "$qa_root/floorp-notes-sync-two-client.xcresult" \
            --target "$qa_root/xcodebuild.log" \
            --target "$qa_root/desktop.log" \
            --target "$qa_root/production-qa-capability.json" \
            --target "$qa_root/production-qa.xcconfig" \
            --target "$qa_root/review-receipt.json" \
            --target "$qa_root/pr-metadata.json" \
            --target "$qa_root/reviews-metadata.json" \
            --target "$qa_root/ruleset-metadata.json"
          /usr/bin/python3 -I scripts/ci/record-floorp-notes-sync-self-attestation.py \
            --output "$qa_root/self-attestation.jsonl" \
            --manifest "$manifest" \
            --summary "$qa_root/qa-summary.json" \
            --cleanup-receipt "$qa_root/cleanup-receipt.json" \
            --secret-scan "$qa_root/secret-scan-pre.json" \
            --review-receipt "$FLOORP_NOTES_SYNC_REVIEW_RECEIPT"
          reviewed_head_sha="$(/usr/bin/python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["head_sha"])' "$FLOORP_NOTES_SYNC_REVIEW_RECEIPT")"
          /usr/bin/python3 -I scripts/ci/validate-floorp-notes-sync-self-attestation.py \
            --ledger "$qa_root/self-attestation.jsonl" \
            --head-sha "$reviewed_head_sha" \
            --merged-oid "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --manifest "$manifest" \
            --summary "$qa_root/qa-summary.json" \
            --cleanup-receipt "$qa_root/cleanup-receipt.json" \
            --secret-scan "$qa_root/secret-scan-pre.json" \
            --review-receipt "$FLOORP_NOTES_SYNC_REVIEW_RECEIPT"
          printf 'FLOORP_NOTES_SYNC_QA_MANIFEST=%s\n' "$manifest" >> "$GITHUB_ENV"

      - name: Scan final QA artifacts including self-attestation
        if: success()
        env:
          FLOORP_NOTES_SYNC_ACCOUNT_A_EMAIL: ${{ secrets.FLOORP_NOTES_SYNC_ACCOUNT_A_EMAIL }}
          FLOORP_NOTES_SYNC_ACCOUNT_A_PASSWORD: ${{ secrets.FLOORP_NOTES_SYNC_ACCOUNT_A_PASSWORD }}
          FLOORP_NOTES_SYNC_ACCOUNT_B_EMAIL: ${{ secrets.FLOORP_NOTES_SYNC_ACCOUNT_B_EMAIL }}
          FLOORP_NOTES_SYNC_ACCOUNT_B_PASSWORD: ${{ secrets.FLOORP_NOTES_SYNC_ACCOUNT_B_PASSWORD }}
          FLOORP_TODO20_GH_AUDIT_TOKEN: ${{ secrets.FLOORP_TODO20_GH_AUDIT_TOKEN }}
        run: |
          set -euo pipefail
          qa_root="$RUNNER_TEMP/floorp-notes-sync-production-qa"
          /usr/bin/python3 -I scripts/ci/record-floorp-notes-sync-secret-scan.py \
            --output "$qa_root/secret-scan.json" \
            --target "$qa_root/qa-summary.json" \
            --target "$qa_root/cleanup-receipt.json" \
            --target "$qa_root/floorp-notes-sync-two-client.xcresult" \
            --target "$qa_root/xcodebuild.log" \
            --target "$qa_root/desktop.log" \
            --target "$qa_root/production-qa-capability.json" \
            --target "$qa_root/production-qa.xcconfig" \
            --target "$qa_root/self-attestation.jsonl" \
            --target "$FLOORP_NOTES_SYNC_REVIEW_RECEIPT" \
            --target "$qa_root/pr-metadata.json" \
            --target "$qa_root/reviews-metadata.json" \
            --target "$qa_root/ruleset-metadata.json" \
            --secret-env FLOORP_NOTES_SYNC_ACCOUNT_A_EMAIL \
            --secret-env FLOORP_NOTES_SYNC_ACCOUNT_A_PASSWORD \
            --secret-env FLOORP_NOTES_SYNC_ACCOUNT_B_EMAIL \
            --secret-env FLOORP_NOTES_SYNC_ACCOUNT_B_PASSWORD \
            --secret-env FLOORP_TODO20_GH_AUDIT_TOKEN
          /usr/bin/python3 -I scripts/ci/validate-floorp-notes-sync-secret-scan.py \
            --receipt "$qa_root/secret-scan.json" \
            --head-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --manifest "$qa_root/qa-manifest.json" \
            --target "$qa_root/qa-summary.json" \
            --target "$qa_root/cleanup-receipt.json" \
            --target "$qa_root/floorp-notes-sync-two-client.xcresult" \
            --target "$qa_root/xcodebuild.log" \
            --target "$qa_root/desktop.log" \
            --target "$qa_root/production-qa-capability.json" \
            --target "$qa_root/production-qa.xcconfig" \
            --target "$qa_root/self-attestation.jsonl" \
            --target "$FLOORP_NOTES_SYNC_REVIEW_RECEIPT" \
            --target "$qa_root/pr-metadata.json" \
            --target "$qa_root/reviews-metadata.json" \
            --target "$qa_root/ruleset-metadata.json"

      - name: Clean up test accounts and client state
        if: always()
        run: |
          set -euo pipefail
          /usr/bin/python3 -I scripts/ci/cleanup-floorp-notes-sync-production-qa.py \
            --work-root "$RUNNER_TEMP/floorp-notes-sync-production-qa/client-state"

      - name: Clean up Simulator Keychain and local cache
        if: always()
        run: |
          set -euo pipefail
          test -n "${FLOORP_NOTES_SYNC_QA_SIMULATOR_UDID:-}"
          xcrun simctl shutdown "$FLOORP_NOTES_SYNC_QA_SIMULATOR_UDID" || true
          xcrun simctl erase "$FLOORP_NOTES_SYNC_QA_SIMULATOR_UDID"

      - name: Upload live QA xcresult
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: floorp-notes-sync-two-client-xcresult
          path: |
            ${{ runner.temp }}/floorp-notes-sync-production-qa/floorp-notes-sync-two-client.xcresult
          if-no-files-found: error
          retention-days: 7

      - name: Upload live QA evidence
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: floorp-notes-sync-two-client-qa-metadata-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/floorp-notes-sync-production-qa/qa-summary.json
            ${{ runner.temp }}/floorp-notes-sync-production-qa/cleanup-receipt.json
            ${{ runner.temp }}/floorp-notes-sync-production-qa/secret-scan-pre.json
            ${{ runner.temp }}/floorp-notes-sync-production-qa/secret-scan.json
            ${{ runner.temp }}/floorp-notes-sync-production-qa/qa-manifest.json
            ${{ runner.temp }}/floorp-notes-sync-production-qa/xcodebuild.log
            ${{ runner.temp }}/floorp-notes-sync-production-qa/desktop.log
            ${{ runner.temp }}/floorp-notes-sync-production-qa/production-qa-capability.json
            ${{ runner.temp }}/floorp-notes-sync-production-qa/production-qa.xcconfig
            ${{ runner.temp }}/floorp-notes-sync-production-qa/self-attestation.jsonl
            ${{ runner.temp }}/floorp-notes-sync-production-qa/review-receipt.json
            ${{ runner.temp }}/floorp-notes-sync-production-qa/pr-metadata.json
            ${{ runner.temp }}/floorp-notes-sync-production-qa/reviews-metadata.json
            ${{ runner.temp }}/floorp-notes-sync-production-qa/ruleset-metadata.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove runner-local QA material
        if: always()
        run: |
          set -euo pipefail
          /usr/bin/python3 -I scripts/ci/cleanup-floorp-notes-sync-production-qa.py \
            --work-root "$RUNNER_TEMP/floorp-notes-sync-production-qa"

  notes-sync-production-enablement:
    name: Todo 20 non-distributed production Sync enablement gate
    needs: notes-sync-production-qa
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.run_floorp_notes_sync_production_qa == true &&
      inputs.run_floorp_notes_sync_production_enablement == true &&
      needs['notes-sync-production-qa'].result == 'success'
    environment: floorp-notes-sync-production-qa
    permissions:
      actions: read
    runs-on: macos-26
    timeout-minutes: 20
    env:
      # Re-bind Phase 2 to the exact reviewed Desktop source used in Phase 1.
      FLOORP_DESKTOP_COMMIT: 8462074ce18ab63d9be4def199b33de1d6bb554a
      FLOORP_TODO20_PR_NUMBER: ${{ vars.FLOORP_TODO20_PR_NUMBER }}
      FLOORP_TODO20_OWNER_REVIEW_JSON: ${{ vars.FLOORP_TODO20_OWNER_REVIEW_JSON }}
      FLOORP_TODO20_MERGE_AUDIT_JSON: ${{ vars.FLOORP_TODO20_MERGE_AUDIT_JSON }}

    steps:
      - name: Check out source anonymously
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_TERMINAL_PROMPT: "0"
          GIT_ASKPASS: /usr/bin/false
        run: |
          set -euo pipefail
          git -C "$GITHUB_WORKSPACE" init --quiet
          git -C "$GITHUB_WORKSPACE" \
            -c credential.helper= \
            -c http.https://github.com/.extraheader= \
            remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" \
            -c credential.helper= \
            -c http.https://github.com/.extraheader= \
            fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach --force FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Download Phase 1 metadata-only summary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: floorp-notes-sync-two-client-qa-metadata-${{ github.run_id }}
          path: ${{ runner.temp }}/floorp-notes-sync-phase1

      - name: Download Phase 1 XCResult
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: floorp-notes-sync-two-client-xcresult
          path: ${{ runner.temp }}/floorp-notes-sync-phase1

      - name: Re-validate Phase 1 production-QA capability binding
        run: |
          set -euo pipefail
          /usr/bin/python3 -I scripts/ci/validate-floorp-notes-sync-production-qa-capability.py \
            --capability "$RUNNER_TEMP/floorp-notes-sync-phase1/production-qa-capability.json" \
            --source-sha "$GITHUB_SHA" \
            --desktop-sha "$FLOORP_DESKTOP_COMMIT" \
            --contract scripts/ci/floorp-notes-sync-g5-operation-contract.json \
            --endpoint-policy docs/floorp-release-endpoints.json
          /usr/bin/python3 -I scripts/ci/validate-floorp-notes-sync-self-attestation.py \
            --ledger "$RUNNER_TEMP/floorp-notes-sync-phase1/self-attestation.jsonl" \
            --head-sha "$(/usr/bin/python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["head_sha"])' "$RUNNER_TEMP/floorp-notes-sync-phase1/review-receipt.json")" \
            --merged-oid "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --manifest "$RUNNER_TEMP/floorp-notes-sync-phase1/qa-manifest.json" \
            --summary "$RUNNER_TEMP/floorp-notes-sync-phase1/qa-summary.json" \
            --cleanup-receipt "$RUNNER_TEMP/floorp-notes-sync-phase1/cleanup-receipt.json" \
            --secret-scan "$RUNNER_TEMP/floorp-notes-sync-phase1/secret-scan-pre.json" \
            --review-receipt "$RUNNER_TEMP/floorp-notes-sync-phase1/review-receipt.json"

      - name: Verify Phase 1 cleanup receipt
        run: |
          set -euo pipefail
          /usr/bin/python3 -I scripts/ci/validate-floorp-notes-sync-production-qa-cleanup.py \
            --summary "$RUNNER_TEMP/floorp-notes-sync-phase1/qa-summary.json" \
            --receipt "$RUNNER_TEMP/floorp-notes-sync-phase1/cleanup-receipt.json"

      - name: Verify Phase 1 secret-scan receipt
        run: |
          set -euo pipefail
          /usr/bin/python3 -I scripts/ci/validate-floorp-notes-sync-secret-scan.py \
            --receipt "$RUNNER_TEMP/floorp-notes-sync-phase1/secret-scan.json" \
            --head-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --manifest "$RUNNER_TEMP/floorp-notes-sync-phase1/qa-manifest.json" \
            --target "$RUNNER_TEMP/floorp-notes-sync-phase1/qa-summary.json" \
            --target "$RUNNER_TEMP/floorp-notes-sync-phase1/cleanup-receipt.json" \
            --target "$RUNNER_TEMP/floorp-notes-sync-phase1/floorp-notes-sync-two-client.xcresult" \
            --target "$RUNNER_TEMP/floorp-notes-sync-phase1/xcodebuild.log" \
            --target "$RUNNER_TEMP/floorp-notes-sync-phase1/desktop.log" \
            --target "$RUNNER_TEMP/floorp-notes-sync-phase1/production-qa-capability.json" \
            --target "$RUNNER_TEMP/floorp-notes-sync-phase1/production-qa.xcconfig" \
            --target "$RUNNER_TEMP/floorp-notes-sync-phase1/self-attestation.jsonl" \
            --target "$RUNNER_TEMP/floorp-notes-sync-phase1/review-receipt.json" \
            --target "$RUNNER_TEMP/floorp-notes-sync-phase1/pr-metadata.json" \
            --target "$RUNNER_TEMP/floorp-notes-sync-phase1/reviews-metadata.json" \
            --target "$RUNNER_TEMP/floorp-notes-sync-phase1/ruleset-metadata.json"

      - name: Create non-distributed enablement record
        env:
          FLOORP_NOTES_SYNC_ENABLEMENT_APPROVED: "1"
        run: |
          set -euo pipefail
          /usr/bin/python3 -I scripts/ci/create-floorp-notes-sync-production-enablement.py \
            --phase1-summary "$RUNNER_TEMP/floorp-notes-sync-phase1/qa-summary.json" \
            --cleanup-receipt "$RUNNER_TEMP/floorp-notes-sync-phase1/cleanup-receipt.json" \
            --secret-scan-receipt "$RUNNER_TEMP/floorp-notes-sync-phase1/secret-scan.json" \
            --secret-scan-target "$RUNNER_TEMP/floorp-notes-sync-phase1/qa-summary.json" \
            --secret-scan-target "$RUNNER_TEMP/floorp-notes-sync-phase1/cleanup-receipt.json" \
            --secret-scan-target "$RUNNER_TEMP/floorp-notes-sync-phase1/floorp-notes-sync-two-client.xcresult" \
            --secret-scan-target "$RUNNER_TEMP/floorp-notes-sync-phase1/xcodebuild.log" \
            --secret-scan-target "$RUNNER_TEMP/floorp-notes-sync-phase1/desktop.log" \
            --secret-scan-target "$RUNNER_TEMP/floorp-notes-sync-phase1/production-qa-capability.json" \
            --secret-scan-target "$RUNNER_TEMP/floorp-notes-sync-phase1/production-qa.xcconfig" \
            --secret-scan-target "$RUNNER_TEMP/floorp-notes-sync-phase1/self-attestation.jsonl" \
            --secret-scan-target "$RUNNER_TEMP/floorp-notes-sync-phase1/review-receipt.json" \
            --secret-scan-target "$RUNNER_TEMP/floorp-notes-sync-phase1/pr-metadata.json" \
            --secret-scan-target "$RUNNER_TEMP/floorp-notes-sync-phase1/reviews-metadata.json" \
            --secret-scan-target "$RUNNER_TEMP/floorp-notes-sync-phase1/ruleset-metadata.json" \
            --output "$RUNNER_TEMP/floorp-notes-sync-phase2/enablement-record.json"

      - name: Validate non-distributed enablement record
        run: |
          set -euo pipefail
          /usr/bin/python3 -I scripts/ci/validate-floorp-notes-sync-production-enablement.py \
            --phase1-summary "$RUNNER_TEMP/floorp-notes-sync-phase1/qa-summary.json" \
            --cleanup-receipt "$RUNNER_TEMP/floorp-notes-sync-phase1/cleanup-receipt.json" \
            --secret-scan-receipt "$RUNNER_TEMP/floorp-notes-sync-phase1/secret-scan.json" \
            --secret-scan-target "$RUNNER_TEMP/floorp-notes-sync-phase1/qa-summary.json" \
            --secret-scan-target "$RUNNER_TEMP/floorp-notes-sync-phase1/cleanup-receipt.json" \
            --secret-scan-target "$RUNNER_TEMP/floorp-notes-sync-phase1/floorp-notes-sync-two-client.xcresult" \
            --secret-scan-target "$RUNNER_TEMP/floorp-notes-sync-phase1/xcodebuild.log" \
            --secret-scan-target "$RUNNER_TEMP/floorp-notes-sync-phase1/desktop.log" \
            --secret-scan-target "$RUNNER_TEMP/floorp-notes-sync-phase1/production-qa-capability.json" \
            --secret-scan-target "$RUNNER_TEMP/floorp-notes-sync-phase1/production-qa.xcconfig" \
            --secret-scan-target "$RUNNER_TEMP/floorp-notes-sync-phase1/self-attestation.jsonl" \
            --secret-scan-target "$RUNNER_TEMP/floorp-notes-sync-phase1/review-receipt.json" \
            --secret-scan-target "$RUNNER_TEMP/floorp-notes-sync-phase1/pr-metadata.json" \
            --secret-scan-target "$RUNNER_TEMP/floorp-notes-sync-phase1/reviews-metadata.json" \
            --secret-scan-target "$RUNNER_TEMP/floorp-notes-sync-phase1/ruleset-metadata.json" \
            --enablement-record "$RUNNER_TEMP/floorp-notes-sync-phase2/enablement-record.json"

      - name: Upload enablement metadata
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: floorp-notes-sync-production-enablement-${{ github.run_id }}
          path: ${{ runner.temp }}/floorp-notes-sync-phase2/enablement-record.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove enablement runner-local material
        if: always()
        run: |
          set -euo pipefail
          /usr/bin/python3 -I scripts/ci/cleanup-floorp-notes-sync-production-qa.py \
            --work-root "$RUNNER_TEMP/floorp-notes-sync-phase1"
          /usr/bin/python3 -I scripts/ci/cleanup-floorp-notes-sync-production-qa.py \
            --work-root "$RUNNER_TEMP/floorp-notes-sync-phase2"
