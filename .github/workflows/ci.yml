name: Floorp iOS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_floorp_notes_sync_protected_preflight:
        description: Compile the protected Notes Sync G5 selector without executing it.
        required: false
        default: false
        type: boolean
      prepare_floorp_notes_sync_g5_contract:
        description: Validate the non-live G5 operation contract and compile its selector only.
        required: false
        default: false
        type: boolean
      run_floorp_notes_sync_production_qa:
        description: Run the protected two-account production Sync data-integrity QA matrix.
        required: false
        default: false
        type: boolean
      run_floorp_notes_sync_production_enablement:
        description: Record non-distributed production Sync enablement only after the QA matrix succeeds.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: >-
    floorp-ios-ci-${{ github.event_name }}-${{
    (inputs.run_floorp_notes_sync_protected_preflight == true ||
    inputs.prepare_floorp_notes_sync_g5_contract == true ||
    inputs.run_floorp_notes_sync_production_qa == true ||
    inputs.run_floorp_notes_sync_production_enablement == true) && github.run_id ||
    github.event.pull_request.number || github.ref }}
  cancel-in-progress: >-
    ${{ github.event_name != 'workflow_dispatch' ||
    (inputs.run_floorp_notes_sync_protected_preflight != true &&
    inputs.prepare_floorp_notes_sync_g5_contract != true &&
    inputs.run_floorp_notes_sync_production_qa != true &&
    inputs.run_floorp_notes_sync_production_enablement != true) }}

env:
  L10N_REVIEW_BASE: e58637e772e4456efcf7dbf3826f172c7da721ba
  L10N_REVIEWED: 9e46feb476739c508bb6d23a8ec92508d72adae0
  PROJECT_PATH: firefox-ios/Client.xcodeproj
  SCHEME: Fennec
  CONFIGURATION: Fennec_Testing
  SIMULATOR_NAME: iPhone 17
  SIMULATOR_OS: "26.2"
  UPSTREAM_REPOSITORY: https://github.com/mozilla-mobile/firefox-ios.git

jobs:
  workflow-lint:
    name: Validate workflows
    if: >-
      github.event_name != 'workflow_dispatch' || (
      inputs.run_floorp_notes_sync_protected_preflight != true &&
      inputs.prepare_floorp_notes_sync_g5_contract != true &&
      inputs.run_floorp_notes_sync_production_qa != true &&
      inputs.run_floorp_notes_sync_production_enablement != true)
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check Floorp branding contracts
        run: ./scripts/ci/check-floorp-branding.sh
        env:
          # ubuntu runners don't guarantee ripgrep; exercise the portable path.
          FLOORP_BRANDING_SEARCH_BACKEND: grep

      - name: Check Floorp Application Services pin
        run: |
          ./scripts/ci/check-application-services-pin.sh
          ./scripts/ci/test-application-services-pin-sync.sh

      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

  build-and-test:
    name: Build and unit test
    if: >-
      github.event_name != 'workflow_dispatch' || (
      inputs.run_floorp_notes_sync_protected_preflight != true &&
      inputs.prepare_floorp_notes_sync_g5_contract != true &&
      inputs.run_floorp_notes_sync_production_qa != true &&
      inputs.run_floorp_notes_sync_production_enablement != true)
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify Floorp localization overlay
        run: |
          node scripts/l10n/floorp-l10n-overlay.mjs extract \
            --base "$L10N_REVIEW_BASE" \
            --reviewed "$L10N_REVIEWED" \
            --check-counts \
            --check
          node --test scripts/l10n/__tests__/*.test.mjs

          git remote add upstream "$UPSTREAM_REPOSITORY" || git remote set-url upstream "$UPSTREAM_REPOSITORY"
          git fetch --no-tags upstream main
          upstream_source="$(git merge-base HEAD upstream/main)"
          node scripts/l10n/floorp-l10n-overlay.mjs verify --source-ref "$upstream_source"
          ./scripts/ci/test-rebrand-dry-run.sh

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Run Floorp release contract tests
        run: |
          env -u GITHUB_API_URL -u GITHUB_SERVER_URL \
            python3 -m unittest discover -s scripts/ci/tests -p 'test_*.py'
          env -u GITHUB_API_URL -u GITHUB_SERVER_URL \
            python3 -m unittest discover -s scripts/staging/tests -p 'test_*.py'

      - name: Select Xcode
        run: |
          xcode_version="$(<.xcode-version)"
          sudo xcode-select --switch "/Applications/Xcode_${xcode_version}.app/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Bootstrap generated sources
        run: ./bootstrap.sh firefox
        env:
          CI: "true"

      - name: Audit Node.js dependencies
        run: npm audit --audit-level=high

      - name: Install SwiftLint
        if: github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'automation/upstream-sync')
        run: ./scripts/ci/install-swiftlint.sh "$RUNNER_TEMP/swiftlint"

      - name: Lint changed Swift files
        if: github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'automation/upstream-sync')
        run: ./scripts/ci/lint-changed-swift.sh "$RUNNER_TEMP/swiftlint/swiftlint" "$BASE_SHA" "$GITHUB_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -onlyUsePackageVersionsFromResolvedFile \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"

      - name: Prepare iOS Simulator
        timeout-minutes: 10
        run: |
          runtime="com.apple.CoreSimulator.SimRuntime.iOS-${SIMULATOR_OS//./-}"
          simulator_id="$(
            xcrun simctl list devices available --json \
              | jq -er --arg runtime "$runtime" --arg name "$SIMULATOR_NAME" \
                '.devices[$runtime] | map(select(.name == $name)) | first | .udid'
          )"
          simulator_arch="$(uname -m)"

          xcrun simctl bootstatus "$simulator_id" -b
          printf 'DESTINATION=platform=iOS Simulator,id=%s,arch=%s\n' \
            "$simulator_id" "$simulator_arch" >> "$GITHUB_ENV"
          printf 'Using %s (%s, %s)\n' "$SIMULATOR_NAME" "$simulator_id" "$simulator_arch"

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing -quiet \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "$DESTINATION" \
            -testPlan FloorpCI \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipMacroValidation \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY= \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/build.log"

      # Compile only: normal PR/main CI has no production-QA authorization,
      # credentials, or G5 evidence role.
      - name: Compile release-disabled G5 XCTest route
        run: |
          set -o pipefail
          xcodebuild build-for-testing -quiet \
            -project "$PROJECT_PATH" \
            -scheme FloorpNotesSyncG5 \
            -configuration FloorpRelease \
            -destination "$DESTINATION" \
            -testPlan FloorpNotesSyncG5 \
            -only-testing:XCUITests/FloorpNotesSyncTwoClientMatrixTests/testTwoClientProductionMatrix \
            -derivedDataPath "$RUNNER_TEMP/G5RouteCompileDerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipMacroValidation \
            -parallel-testing-enabled NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY= \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/g5-route-compile.log"

      - name: Run unit tests
        timeout-minutes: 30
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "$DESTINATION" \
            -testPlan FloorpCI \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipMacroValidation \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 60 \
            -maximum-test-execution-time-allowance 120 \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -test-repetition-relaunch-enabled YES \
            -resultBundlePath "$RUNNER_TEMP/FloorpCI.xcresult" \
            CODE_SIGN_IDENTITY= \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/test.log"

          if grep -Fq \
            "Fatal error: No definition registered for type:" \
            "$RUNNER_TEMP/test.log"; then
            echo "::error::Unit-test host resolved an AppContainer dependency after teardown"
            exit 1
          fi

      - name: Upload Notes Sync G3 result
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: floorp-notes-sync-xcresult
          path: ${{ runner.temp }}/FloorpCI.xcresult
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: floorp-ios-ci-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/test.log
            ${{ runner.temp }}/FloorpCI.xcresult
          if-no-files-found: ignore
          retention-days: 7

  release-disabled-wrapper:
    name: Release-disabled wrapper build
    if: >-
      github.event_name != 'workflow_dispatch' || (
      inputs.run_floorp_notes_sync_protected_preflight != true &&
      inputs.prepare_floorp_notes_sync_g5_contract != true &&
      inputs.run_floorp_notes_sync_production_qa != true &&
      inputs.run_floorp_notes_sync_production_enablement != true)
    runs-on: macos-26
    timeout-minutes: 90
    needs: workflow-lint

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          xcode_version="$(<.xcode-version)"
          sudo xcode-select --switch "/Applications/Xcode_${xcode_version}.app/Contents/Developer"
          xcodebuild -version

      - name: Run release-disabled wrapper
        run: |
          ./scripts/staging/build-floorp-notes-sync-ios.sh \
            --mode release-disabled \
            --source-sha "$GITHUB_SHA" \
            --output-dir "$RUNNER_TEMP/floorp-notes-sync-release-disabled" \
            --manifest "$RUNNER_TEMP/floorp-notes-sync-release-disabled-manifest.json"

      - name: Upload release-disabled diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: floorp-ios-release-disabled-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/floorp-notes-sync-release-disabled/contract-inputs
            ${{ runner.temp }}/floorp-notes-sync-release-disabled/xcodebuild.log
            ${{ runner.temp }}/floorp-notes-sync-release-disabled-manifest.json
          if-no-files-found: ignore
          retention-days: 7

  # This Environment-bound job is a manual scheduling preflight only. It
  # compiles the guard XCTest without executing it and must not be treated as
  # G5 evidence or execution authorization.
  notes-sync-protected-preflight:
    name: Protected Notes Sync compile-only preflight
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.run_floorp_notes_sync_protected_preflight == true &&
      inputs.prepare_floorp_notes_sync_g5_contract != true &&
      inputs.run_floorp_notes_sync_production_qa != true &&
      inputs.run_floorp_notes_sync_production_enablement != true
    environment: floorp-notes-sync-production-qa
    # Override the workflow-wide read permission. This job must not receive a
    # usable GitHub token or invoke a token-defaulting source checkout action.
    permissions: {}
    env:
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
      NODE_AUTH_TOKEN: ""
      NPM_TOKEN: ""
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_TERMINAL_PROMPT: "0"
      GIT_ASKPASS: /usr/bin/false
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Check out source anonymously
        run: |
          set -euo pipefail
          git -C "$GITHUB_WORKSPACE" init --quiet
          git -C "$GITHUB_WORKSPACE" \
            -c credential.helper= \
            -c http.https://github.com/.extraheader= \
            remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" \
            -c credential.helper= \
            -c http.https://github.com/.extraheader= \
            fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach --force FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          token: ""
          package-manager-cache: false

      - name: Select Xcode
        run: |
          xcode_version="$(<.xcode-version)"
          sudo xcode-select --switch "/Applications/Xcode_${xcode_version}.app/Contents/Developer"
          xcodebuild -version

      - name: Bootstrap generated sources
        run: ./bootstrap.sh firefox
        env:
          CI: "true"

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT_PATH" \
            -scheme FloorpNotesSyncG5 \
            -onlyUsePackageVersionsFromResolvedFile \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"

      - name: Prepare iOS Simulator
        timeout-minutes: 10
        run: |
          runtime="com.apple.CoreSimulator.SimRuntime.iOS-${SIMULATOR_OS//./-}"
          simulator_id="$(
            xcrun simctl list devices available --json \
              | jq -er --arg runtime "$runtime" --arg name "$SIMULATOR_NAME" \
                '.devices[$runtime] | map(select(.name == $name)) | first | .udid'
          )"
          simulator_arch="$(uname -m)"

          xcrun simctl bootstatus "$simulator_id" -b
          printf 'DESTINATION=platform=iOS Simulator,id=%s,arch=%s\n' \
            "$simulator_id" "$simulator_arch" >> "$GITHUB_ENV"

      - name: Compile protected G5 XCTest route
        run: |
          set -o pipefail
          xcodebuild build-for-testing -quiet \
            -project "$PROJECT_PATH" \
            -scheme FloorpNotesSyncG5 \
            -configuration FloorpRelease \
            -destination "$DESTINATION" \
            -testPlan FloorpNotesSyncG5 \
            -only-testing:XCUITests/FloorpNotesSyncTwoClientMatrixTests/testTwoClientProductionMatrix \
            -derivedDataPath "$RUNNER_TEMP/ProtectedG5PreflightDerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipMacroValidation \
            -parallel-testing-enabled NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY= \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/protected-g5-preflight-compile.log"

  # This Environment-bound job validates the checked-in Todo 20 contract and
  # compiles the guard selector only. It is not Phase 1 QA and receives no
  # account secrets.
  notes-sync-g5-operation-contract-preflight:
    name: Todo 20 operation-contract compile preflight
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.prepare_floorp_notes_sync_g5_contract == true &&
      inputs.run_floorp_notes_sync_protected_preflight != true &&
      inputs.run_floorp_notes_sync_production_qa != true &&
      inputs.run_floorp_notes_sync_production_enablement != true
    environment: floorp-notes-sync-production-qa
    permissions: {}
    env:
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
      NODE_AUTH_TOKEN: ""
      NPM_TOKEN: ""
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_TERMINAL_PROMPT: "0"
      GIT_ASKPASS: /usr/bin/false
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Check out source anonymously
        run: |
          set -euo pipefail
          git -C "$GITHUB_WORKSPACE" init --quiet
          git -C "$GITHUB_WORKSPACE" \
            -c credential.helper= \
            -c http.https://github.com/.extraheader= \
            remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" \
            -c credential.helper= \
            -c http.https://github.com/.extraheader= \
            fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach --force FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          token: ""
          package-manager-cache: false

      - name: Validate non-live G5 operation contract
        run: |
          /usr/bin/python3 -I scripts/ci/validate-floorp-notes-sync-g5-operation-contract.py \
            --contract scripts/ci/floorp-notes-sync-g5-operation-contract.json

      - name: Select Xcode
        run: |
          xcode_version="$(<.xcode-version)"
          sudo xcode-select --switch "/Applications/Xcode_${xcode_version}.app/Contents/Developer"
          xcodebuild -version

      - name: Bootstrap generated sources
        run: ./bootstrap.sh firefox
        env:
          CI: "true"

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT_PATH" \
            -scheme FloorpNotesSyncG5 \
            -onlyUsePackageVersionsFromResolvedFile \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"

      - name: Compile non-live G5 XCTest route
        run: |
          set -o pipefail
          xcodebuild build-for-testing -quiet \
            -project "$PROJECT_PATH" \
            -scheme FloorpNotesSyncG5 \
            -configuration FloorpRelease \
            -destination 'generic/platform=iOS Simulator' \
            -testPlan FloorpNotesSyncG5 \
            -only-testing:XCUITests/FloorpNotesSyncTwoClientMatrixTests/testTwoClientProductionMatrix \
            -derivedDataPath "$RUNNER_TEMP/OperationContractG5CompileDerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipMacroValidation \
            -parallel-testing-enabled NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY= \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/operation-contract-g5-compile.log"

  notes-sync-production-qa:
    name: Todo 20 protected two-client production QA
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.run_floorp_notes_sync_production_qa == true
    environment: floorp-notes-sync-production-qa
    permissions: {}
    runs-on: macos-26
    timeout-minutes: 180
    env:
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
      NODE_AUTH_TOKEN: ""
      NPM_TOKEN: ""
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_TERMINAL_PROMPT: "0"
      GIT_ASKPASS: /usr/bin/false
      # Updated only after the reviewed Desktop UI-hook PR is squash-merged.
      FLOORP_DESKTOP_COMMIT: 8462074ce18ab63d9be4def199b33de1d6bb554a

    steps:
      - name: Check out source anonymously
        run: |
          set -euo pipefail
          git -C "$GITHUB_WORKSPACE" init --quiet
          git -C "$GITHUB_WORKSPACE" \
            -c credential.helper= \
            -c http.https://github.com/.extraheader= \
            remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" \
            -c credential.helper= \
            -c http.https://github.com/.extraheader= \
            fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach --force FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Check out reviewed Desktop source anonymously
        run: |
          set -euo pipefail
          desktop_root="$RUNNER_TEMP/floorp-desktop"
          git init --quiet "$desktop_root"
          git -C "$desktop_root" \
            -c credential.helper= \
            -c http.https://github.com/.extraheader= \
            remote add origin https://github.com/Floorp-Projects/Floorp.git
          git -C "$desktop_root" \
            -c credential.helper= \
            -c http.https://github.com/.extraheader= \
            fetch --no-tags --depth=1 origin "$FLOORP_DESKTOP_COMMIT"
          git -C "$desktop_root" checkout --detach --force FETCH_HEAD
          test "$(git -C "$desktop_root" rev-parse HEAD)" = "$FLOORP_DESKTOP_COMMIT"
          printf 'FLOORP_NOTES_SYNC_DESKTOP_ROOT=%s\n' "$desktop_root" >> "$GITHUB_ENV"

      - name: Create protected Todo 20 production-QA capability
        run: |
          set -euo pipefail
          qa_root="$RUNNER_TEMP/floorp-notes-sync-production-qa"
          install -d -m 700 "$qa_root"
          capability="$qa_root/production-qa-capability.json"
          xcconfig="$qa_root/production-qa.xcconfig"
          /usr/bin/python3 -I scripts/ci/create-floorp-notes-sync-production-qa-capability.py \
            --contract scripts/ci/floorp-notes-sync-g5-operation-contract.json \
            --endpoint-policy docs/floorp-release-endpoints.json \
            --desktop-sha "$FLOORP_DESKTOP_COMMIT" \
            --ios-build-number 4 \
            --output "$capability"
          /usr/bin/python3 -I scripts/ci/validate-floorp-notes-sync-production-qa-capability.py \
            --capability "$capability" \
            --source-sha "$GITHUB_SHA" \
            --desktop-sha "$FLOORP_DESKTOP_COMMIT" \
            --contract scripts/ci/floorp-notes-sync-g5-operation-contract.json \
            --endpoint-policy docs/floorp-release-endpoints.json
          /usr/bin/python3 -I scripts/ci/prepare-floorp-notes-sync-production-qa-build.py \
            --capability "$capability" \
            --source-sha "$GITHUB_SHA" \
            --desktop-sha "$FLOORP_DESKTOP_COMMIT" \
            --contract scripts/ci/floorp-notes-sync-g5-operation-contract.json \
            --endpoint-policy docs/floorp-release-endpoints.json \
            --output "$xcconfig"
          /usr/bin/python3 -I scripts/ci/record-floorp-notes-sync-self-attestation.py \
            --output "$qa_root/self-attestation.jsonl"
          {
            printf 'FLOORP_NOTES_SYNC_QA_ROOT=%s\n' "$qa_root"
            printf 'FLOORP_NOTES_SYNC_QA_CAPABILITY=%s\n' "$capability"
            printf 'FLOORP_NOTES_SYNC_QA_XCCONFIG=%s\n' "$xcconfig"
          } >> "$GITHUB_ENV"

      - name: Select Xcode
        run: |
          xcode_version="$(<.xcode-version)"
          sudo xcode-select --switch "/Applications/Xcode_${xcode_version}.app/Contents/Developer"
          xcodebuild -version

      - name: Bootstrap generated sources
        run: ./bootstrap.sh firefox
        env:
          CI: "true"

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT_PATH" \
            -scheme FloorpNotesSyncG5 \
            -onlyUsePackageVersionsFromResolvedFile \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"

      - name: Prepare dedicated QA Simulator
        run: |
          set -euo pipefail
          runtime="com.apple.CoreSimulator.SimRuntime.iOS-${SIMULATOR_OS//./-}"
          simulator_id="$(
            xcrun simctl list devices available --json \
              | jq -er --arg runtime "$runtime" --arg name "$SIMULATOR_NAME" \
                '.devices[$runtime] | map(select(.name == $name)) | first | .udid'
          )"
          simulator_arch="$(uname -m)"
          xcrun simctl boot "$simulator_id" 2>/dev/null || true
          xcrun simctl bootstatus "$simulator_id" -b
          printf 'FLOORP_NOTES_SYNC_QA_SIMULATOR_UDID=%s\n' "$simulator_id" >> "$GITHUB_ENV"
          printf 'FLOORP_NOTES_SYNC_QA_DESTINATION=platform=iOS Simulator,id=%s,arch=%s\n' \
            "$simulator_id" "$simulator_arch" >> "$GITHUB_ENV"

      - name: Run protected two-client integrity QA
        id: client-pair
        env:
          FLOORP_NOTES_SYNC_ACCOUNT_A_EMAIL: ${{ secrets.FLOORP_NOTES_SYNC_ACCOUNT_A_EMAIL }}
          FLOORP_NOTES_SYNC_ACCOUNT_A_PASSWORD: ${{ secrets.FLOORP_NOTES_SYNC_ACCOUNT_A_PASSWORD }}
          FLOORP_NOTES_SYNC_ACCOUNT_B_EMAIL: ${{ secrets.FLOORP_NOTES_SYNC_ACCOUNT_B_EMAIL }}
          FLOORP_NOTES_SYNC_ACCOUNT_B_PASSWORD: ${{ secrets.FLOORP_NOTES_SYNC_ACCOUNT_B_PASSWORD }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -I scripts/ci/run-floorp-notes-sync-production-qa.py \
            --summary "$FLOORP_NOTES_SYNC_QA_ROOT/qa-summary.json" \
            --cleanup-receipt "$FLOORP_NOTES_SYNC_QA_ROOT/cleanup-receipt.json" \
            --desktop-log "$FLOORP_NOTES_SYNC_QA_ROOT/desktop.log" \
            --xcodebuild-log "$FLOORP_NOTES_SYNC_QA_ROOT/xcodebuild.log" \
            --client-state "$FLOORP_NOTES_SYNC_QA_ROOT/client-state" \
            --desktop-root "$FLOORP_NOTES_SYNC_DESKTOP_ROOT" \
            --desktop-sha "$FLOORP_DESKTOP_COMMIT" \
            --simulator-udid "$FLOORP_NOTES_SYNC_QA_SIMULATOR_UDID" \
            --coordination-root "/tmp/floorp-notes-sync-production-qa-$GITHUB_RUN_ID" \
            --ios-project "$GITHUB_WORKSPACE/$PROJECT_PATH" \
            --destination "$FLOORP_NOTES_SYNC_QA_DESTINATION" \
            --derived-data "$FLOORP_NOTES_SYNC_QA_ROOT/DerivedData" \
            --source-packages "$RUNNER_TEMP/SourcePackages" \
            --xcconfig "$FLOORP_NOTES_SYNC_QA_XCCONFIG" \
            --result-bundle "$FLOORP_NOTES_SYNC_QA_ROOT/floorp-notes-sync-two-client.xcresult"

      - name: Validate live production-QA summary and cleanup receipt
        if: success()
        run: |
          set -euo pipefail
          /usr/bin/python3 -I scripts/ci/validate-floorp-notes-sync-production-qa.py \
            --summary "$FLOORP_NOTES_SYNC_QA_ROOT/qa-summary.json"
          /usr/bin/python3 -I scripts/ci/validate-floorp-notes-sync-production-qa-cleanup.py \
            --summary "$FLOORP_NOTES_SYNC_QA_ROOT/qa-summary.json" \
            --receipt "$FLOORP_NOTES_SYNC_QA_ROOT/cleanup-receipt.json"

      - name: Scan QA material for secrets
        if: always()
        run: |
          set -euo pipefail
          qa_root="$RUNNER_TEMP/floorp-notes-sync-production-qa"
          scan_targets=()
          for path in "$qa_root" "$qa_root/floorp-notes-sync-two-client.xcresult"; do
            if [ -e "$path" ]; then
              scan_targets+=("$path")
            fi
          done
          if [ "${#scan_targets[@]}" -eq 0 ]; then
            echo "secret-log scan could not find any QA material"
            exit 1
          fi
          if rg -l -i \
            'password|access_token|refresh_token|sync_key|authorization|bearer |cookie|credential|secret|begin private key|oauth_token|note(_|s_)(content|title|payload)|request_body|response_body' \
            "${scan_targets[@]}" >/dev/null 2>&1; then
            echo "secret-log scan failed"
            exit 1
          fi
          # The protected xcodebuild actor receives secrets through its
          # Environment. Scan command lines only so variable names are not
          # mistaken for leaked credential values.
          /usr/bin/python3 -I scripts/ci/scan-floorp-notes-sync-process-argv.py
          /usr/bin/python3 -I scripts/ci/record-floorp-notes-sync-secret-scan.py \
            --output "$qa_root/secret-scan.json" \
            --target "$qa_root/qa-summary.json" \
            --target "$qa_root/cleanup-receipt.json" \
            --target "$qa_root/floorp-notes-sync-two-client.xcresult" \
            --target "$qa_root/xcodebuild.log" \
            --target "$qa_root/desktop.log" \
            --target "$qa_root/production-qa-capability.json" \
            --target "$qa_root/production-qa.xcconfig" \
            --target "$qa_root/self-attestation.jsonl"

      - name: Clean up test accounts and client state
        if: always()
        run: |
          set -euo pipefail
          /usr/bin/python3 -I scripts/ci/cleanup-floorp-notes-sync-production-qa.py \
            --work-root "$RUNNER_TEMP/floorp-notes-sync-production-qa/client-state"

      - name: Clean up Simulator Keychain and local cache
        if: always()
        run: |
          set -euo pipefail
          test -n "${FLOORP_NOTES_SYNC_QA_SIMULATOR_UDID:-}"
          xcrun simctl shutdown "$FLOORP_NOTES_SYNC_QA_SIMULATOR_UDID" || true
          xcrun simctl erase "$FLOORP_NOTES_SYNC_QA_SIMULATOR_UDID"

      - name: Upload live QA xcresult
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: floorp-notes-sync-two-client-xcresult
          path: |
            ${{ runner.temp }}/floorp-notes-sync-production-qa/floorp-notes-sync-two-client.xcresult
          if-no-files-found: error
          retention-days: 7

      - name: Upload live QA evidence
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: floorp-notes-sync-two-client-qa-metadata-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/floorp-notes-sync-production-qa/qa-summary.json
            ${{ runner.temp }}/floorp-notes-sync-production-qa/cleanup-receipt.json
            ${{ runner.temp }}/floorp-notes-sync-production-qa/secret-scan.json
            ${{ runner.temp }}/floorp-notes-sync-production-qa/xcodebuild.log
            ${{ runner.temp }}/floorp-notes-sync-production-qa/desktop.log
            ${{ runner.temp }}/floorp-notes-sync-production-qa/production-qa-capability.json
            ${{ runner.temp }}/floorp-notes-sync-production-qa/production-qa.xcconfig
            ${{ runner.temp }}/floorp-notes-sync-production-qa/self-attestation.jsonl
          if-no-files-found: error
          retention-days: 7

      - name: Remove runner-local QA material
        if: always()
        run: |
          set -euo pipefail
          /usr/bin/python3 -I scripts/ci/cleanup-floorp-notes-sync-production-qa.py \
            --work-root "$RUNNER_TEMP/floorp-notes-sync-production-qa"

  notes-sync-production-enablement:
    name: Todo 20 non-distributed production Sync enablement gate
    needs: notes-sync-production-qa
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.run_floorp_notes_sync_production_qa == true &&
      inputs.run_floorp_notes_sync_production_enablement == true &&
      needs['notes-sync-production-qa'].result == 'success'
    environment: floorp-notes-sync-production-qa
    permissions:
      actions: read
    runs-on: macos-26
    timeout-minutes: 20
    env:
      # Re-bind Phase 2 to the exact reviewed Desktop source used in Phase 1.
      FLOORP_DESKTOP_COMMIT: 8462074ce18ab63d9be4def199b33de1d6bb554a

    steps:
      - name: Check out source anonymously
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_TERMINAL_PROMPT: "0"
          GIT_ASKPASS: /usr/bin/false
        run: |
          set -euo pipefail
          git -C "$GITHUB_WORKSPACE" init --quiet
          git -C "$GITHUB_WORKSPACE" \
            -c credential.helper= \
            -c http.https://github.com/.extraheader= \
            remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" \
            -c credential.helper= \
            -c http.https://github.com/.extraheader= \
            fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach --force FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Download Phase 1 metadata-only summary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: floorp-notes-sync-two-client-qa-metadata-${{ github.run_id }}
          path: ${{ runner.temp }}/floorp-notes-sync-phase1

      - name: Download Phase 1 XCResult
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: floorp-notes-sync-two-client-xcresult
          path: ${{ runner.temp }}/floorp-notes-sync-phase1

      - name: Re-validate Phase 1 production-QA capability binding
        run: |
          set -euo pipefail
          /usr/bin/python3 -I scripts/ci/validate-floorp-notes-sync-production-qa-capability.py \
            --capability "$RUNNER_TEMP/floorp-notes-sync-phase1/production-qa-capability.json" \
            --source-sha "$GITHUB_SHA" \
            --desktop-sha "$FLOORP_DESKTOP_COMMIT" \
            --contract scripts/ci/floorp-notes-sync-g5-operation-contract.json \
            --endpoint-policy docs/floorp-release-endpoints.json
          /usr/bin/python3 -I scripts/ci/validate-floorp-notes-sync-self-attestation.py \
            --ledger "$RUNNER_TEMP/floorp-notes-sync-phase1/self-attestation.jsonl" \
            --head-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Verify Phase 1 cleanup receipt
        run: |
          set -euo pipefail
          /usr/bin/python3 -I scripts/ci/validate-floorp-notes-sync-production-qa-cleanup.py \
            --summary "$RUNNER_TEMP/floorp-notes-sync-phase1/qa-summary.json" \
            --receipt "$RUNNER_TEMP/floorp-notes-sync-phase1/cleanup-receipt.json"

      - name: Verify Phase 1 secret-scan receipt
        run: |
          set -euo pipefail
          /usr/bin/python3 -I scripts/ci/validate-floorp-notes-sync-secret-scan.py \
            --receipt "$RUNNER_TEMP/floorp-notes-sync-phase1/secret-scan.json" \
            --head-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --target "$RUNNER_TEMP/floorp-notes-sync-phase1/qa-summary.json" \
            --target "$RUNNER_TEMP/floorp-notes-sync-phase1/cleanup-receipt.json" \
            --target "$RUNNER_TEMP/floorp-notes-sync-phase1/floorp-notes-sync-two-client.xcresult" \
            --target "$RUNNER_TEMP/floorp-notes-sync-phase1/xcodebuild.log" \
            --target "$RUNNER_TEMP/floorp-notes-sync-phase1/desktop.log" \
            --target "$RUNNER_TEMP/floorp-notes-sync-phase1/production-qa-capability.json" \
            --target "$RUNNER_TEMP/floorp-notes-sync-phase1/production-qa.xcconfig" \
            --target "$RUNNER_TEMP/floorp-notes-sync-phase1/self-attestation.jsonl"

      - name: Create non-distributed enablement record
        env:
          FLOORP_NOTES_SYNC_ENABLEMENT_APPROVED: "1"
        run: |
          set -euo pipefail
          /usr/bin/python3 -I scripts/ci/create-floorp-notes-sync-production-enablement.py \
            --phase1-summary "$RUNNER_TEMP/floorp-notes-sync-phase1/qa-summary.json" \
            --cleanup-receipt "$RUNNER_TEMP/floorp-notes-sync-phase1/cleanup-receipt.json" \
            --secret-scan-receipt "$RUNNER_TEMP/floorp-notes-sync-phase1/secret-scan.json" \
            --secret-scan-target "$RUNNER_TEMP/floorp-notes-sync-phase1/qa-summary.json" \
            --secret-scan-target "$RUNNER_TEMP/floorp-notes-sync-phase1/cleanup-receipt.json" \
            --secret-scan-target "$RUNNER_TEMP/floorp-notes-sync-phase1/floorp-notes-sync-two-client.xcresult" \
            --secret-scan-target "$RUNNER_TEMP/floorp-notes-sync-phase1/xcodebuild.log" \
            --secret-scan-target "$RUNNER_TEMP/floorp-notes-sync-phase1/desktop.log" \
            --secret-scan-target "$RUNNER_TEMP/floorp-notes-sync-phase1/production-qa-capability.json" \
            --secret-scan-target "$RUNNER_TEMP/floorp-notes-sync-phase1/production-qa.xcconfig" \
            --secret-scan-target "$RUNNER_TEMP/floorp-notes-sync-phase1/self-attestation.jsonl" \
            --output "$RUNNER_TEMP/floorp-notes-sync-phase2/enablement-record.json"

      - name: Validate non-distributed enablement record
        run: |
          set -euo pipefail
          /usr/bin/python3 -I scripts/ci/validate-floorp-notes-sync-production-enablement.py \
            --phase1-summary "$RUNNER_TEMP/floorp-notes-sync-phase1/qa-summary.json" \
            --cleanup-receipt "$RUNNER_TEMP/floorp-notes-sync-phase1/cleanup-receipt.json" \
            --secret-scan-receipt "$RUNNER_TEMP/floorp-notes-sync-phase1/secret-scan.json" \
            --secret-scan-target "$RUNNER_TEMP/floorp-notes-sync-phase1/qa-summary.json" \
            --secret-scan-target "$RUNNER_TEMP/floorp-notes-sync-phase1/cleanup-receipt.json" \
            --secret-scan-target "$RUNNER_TEMP/floorp-notes-sync-phase1/floorp-notes-sync-two-client.xcresult" \
            --secret-scan-target "$RUNNER_TEMP/floorp-notes-sync-phase1/xcodebuild.log" \
            --secret-scan-target "$RUNNER_TEMP/floorp-notes-sync-phase1/desktop.log" \
            --secret-scan-target "$RUNNER_TEMP/floorp-notes-sync-phase1/production-qa-capability.json" \
            --secret-scan-target "$RUNNER_TEMP/floorp-notes-sync-phase1/production-qa.xcconfig" \
            --secret-scan-target "$RUNNER_TEMP/floorp-notes-sync-phase1/self-attestation.jsonl" \
            --enablement-record "$RUNNER_TEMP/floorp-notes-sync-phase2/enablement-record.json"

      - name: Upload enablement metadata
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: floorp-notes-sync-production-enablement-${{ github.run_id }}
          path: ${{ runner.temp }}/floorp-notes-sync-phase2/enablement-record.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove enablement runner-local material
        if: always()
        run: |
          set -euo pipefail
          /usr/bin/python3 -I scripts/ci/cleanup-floorp-notes-sync-production-qa.py \
            --work-root "$RUNNER_TEMP/floorp-notes-sync-phase1"
          /usr/bin/python3 -I scripts/ci/cleanup-floorp-notes-sync-production-qa.py \
            --work-root "$RUNNER_TEMP/floorp-notes-sync-phase2"
