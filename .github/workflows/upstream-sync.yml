name: Upstream Sync

on:
  schedule:
    # Every Monday at 09:00 UTC (18:00 JST)
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: floorp-upstream-sync
  cancel-in-progress: false

jobs:
  sync-upstream:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out Floorp
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/mozilla-mobile/firefox-ios.git || true
          git fetch --no-tags upstream main

      - name: Check for upstream commits
        id: check
        run: |
          upstream_sha="$(git rev-parse upstream/main)"
          merge_base="$(git merge-base HEAD upstream/main)"

          if [[ "$merge_base" == "$upstream_sha" ]]; then
            echo "Floorp already contains upstream/main."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          commit_count="$(git rev-list --count "${merge_base}..${upstream_sha}")"
          echo "Found ${commit_count} new upstream commits."
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "commit_count=${commit_count}" >> "$GITHUB_OUTPUT"

      - name: Merge upstream
        if: steps.check.outputs.has_changes == 'true'
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          floorp_base="$(git rev-parse HEAD)"
          sync_branch="automation/upstream-sync"
          git checkout -B "$sync_branch"

          if ! git merge upstream/main --no-edit; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            unexpected_conflict=false

            while IFS= read -r file; do
              case "$file" in
                .github/workflows/*) ;;
                *)
                  echo "Unexpected merge conflict: $file" >> "$GITHUB_STEP_SUMMARY"
                  unexpected_conflict=true
                  ;;
              esac
            done <<< "$conflicts"

            if [[ "$unexpected_conflict" == "true" ]]; then
              git merge --abort
              exit 1
            fi

            while IFS= read -r file; do
              case "$file" in
                .github/workflows/ci.yml|.github/workflows/upstream-sync.yml)
                  git checkout --ours -- "$file"
                  git add -- "$file"
                  ;;
                .github/workflows/*)
                  git rm -- "$file"
                  ;;
              esac
            done <<< "$conflicts"

            git commit --no-edit
          fi

          git checkout "$floorp_base" -- \
            .github/workflows/ci.yml \
            .github/workflows/upstream-sync.yml \
            scripts/rebrand-to-floorp.sh

          while IFS= read -r -d '' workflow; do
            case "$workflow" in
              .github/workflows/ci.yml|.github/workflows/upstream-sync.yml) ;;
              *) rm -f -- "$workflow" ;;
            esac
          done < <(find .github/workflows -type f -print0)

          echo "branch=${sync_branch}" >> "$GITHUB_OUTPUT"

      - name: Reapply Floorp branding
        if: steps.check.outputs.has_changes == 'true'
        run: ./scripts/rebrand-to-floorp.sh

      - name: Verify generated changes
        if: steps.check.outputs.has_changes == 'true'
        id: verify
        run: |
          git diff --check
          file_count="$(git diff --name-only HEAD | wc -l | tr -d ' ')"
          echo "file_count=${file_count}" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.check.outputs.has_changes == 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: ${{ steps.merge.outputs.branch }}
          delete-branch: true
          commit-message: "feat: sync upstream and re-apply Floorp branding"
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: GitHub <noreply@github.com>
          title: "Sync upstream Firefox iOS (${{ steps.check.outputs.commit_count }} commits)"
          body: |
            ## Upstream Sync

            This PR merges `mozilla-mobile/firefox-ios:main` into Floorp and reapplies the Floorp branding script.

            - Upstream commits: ${{ steps.check.outputs.commit_count }}
            - Files changed by the rebrand step: ${{ steps.verify.outputs.file_count }}
            - Merge conflicts: none (conflicted merges fail without committing conflict markers)

            Before merging:

            - [ ] Review unexpected upstream changes.
            - [ ] Confirm `Floorp iOS CI / Build and unit test` passes.
            - [ ] Check for newly introduced Firefox branding.

      - name: Dispatch CI for the sync branch
        if: steps.create-pr.outputs.pull-request-operation == 'created' || steps.create-pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" \
            --data '{"ref":"automation/upstream-sync"}'
