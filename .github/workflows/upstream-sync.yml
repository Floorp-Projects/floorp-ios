name: Upstream Sync

on:
  schedule:
    # Every Monday at 09:00 UTC (18:00 JST)
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      force_ci:
        description: Dispatch CI even when the sync pull request branch is unchanged
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: floorp-upstream-sync
  cancel-in-progress: false

env:
  FLOORP_BASE_BRANCH: main
  L10N_REVIEW_BASE: e58637e772e4456efcf7dbf3826f172c7da721ba
  L10N_REVIEWED: b0b2960d3dd908ec5f43e9d1b2bfb581b3da788c
  UPSTREAM_BRANCH: main
  UPSTREAM_REPOSITORY: https://github.com/mozilla-mobile/firefox-ios.git
  SYNC_BRANCH: automation/upstream-sync

jobs:
  sync-upstream:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out Floorp
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.FLOORP_BASE_BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_REPOSITORY" || git remote set-url upstream "$UPSTREAM_REPOSITORY"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"

      - name: Check for upstream commits
        id: check
        run: |
          upstream_ref="upstream/$UPSTREAM_BRANCH"
          upstream_sha="$(git rev-parse "$upstream_ref")"
          merge_base="$(git merge-base HEAD "$upstream_ref")"

          if [[ "$merge_base" == "$upstream_sha" ]]; then
            echo "Floorp already contains upstream/main."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          commit_count="$(git rev-list --count "${merge_base}..${upstream_sha}")"
          echo "Found ${commit_count} new upstream commits."
          {
            echo "has_changes=true"
            echo "commit_count=${commit_count}"
            echo "upstream_sha=${upstream_sha}"
            echo "merge_base=${merge_base}"
          } >> "$GITHUB_OUTPUT"

      - name: Validate Floorp localization policy
        if: steps.check.outputs.has_changes == 'true'
        run: |
          node scripts/l10n/floorp-l10n-overlay.mjs extract \
            --base "$L10N_REVIEW_BASE" \
            --reviewed "$L10N_REVIEWED" \
            --check-counts \
            --check
          node --test scripts/l10n/__tests__/*.test.mjs
          ./scripts/ci/test-rebrand-dry-run.sh

      - name: Merge upstream
        if: steps.check.outputs.has_changes == 'true'
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # create-pull-request resets its working base to origin/<branch>.
          git checkout -B "$FLOORP_BASE_BRANCH" "origin/$FLOORP_BASE_BRANCH"
          floorp_base="$(git rev-parse HEAD)"
          upstream_ref="upstream/$UPSTREAM_BRANCH"
          protected_conflict_count=0
          l10n_conflict_count=0

          restore_floorp_automation() {
            git rm -r -f --ignore-unmatch -- .github/workflows floorp/l10n scripts/l10n
            git checkout "$floorp_base" -- \
              .github/workflows \
              floorp/l10n \
              scripts/l10n \
              scripts/rebrand-to-floorp.sh
          }

          write_merge_diagnostics() {
            diagnostics="$RUNNER_TEMP/upstream-sync-diagnostics"
            mkdir -p "$diagnostics"
            {
              echo "floorp_base=$floorp_base"
              echo "upstream_ref=$upstream_ref"
              echo "upstream_sha=$(git rev-parse "$upstream_ref")"
              echo "merge_base=$(git merge-base "$floorp_base" "$upstream_ref")"
            } > "$diagnostics/metadata.txt"
            git status --short > "$diagnostics/status.txt"
            git ls-files -u > "$diagnostics/unmerged-index.txt"
            git diff --cc > "$diagnostics/conflicts.diff"
          }

          abort_merge() {
            write_merge_diagnostics
            git merge --abort
            exit 1
          }

          if ! git merge "$upstream_ref" --no-edit; then
            while IFS= read -r -d '' file; do
              case "$file" in
                .github/workflows/*|floorp/l10n/*|scripts/l10n/*|scripts/rebrand-to-floorp.sh)
                  protected_conflict_count=$((protected_conflict_count + 1))
                  ;;
              esac
            done < <(git diff --name-only --diff-filter=U -z)

            restore_floorp_automation

            while IFS= read -r -d '' _; do
              l10n_conflict_count=$((l10n_conflict_count + 1))
            done < <(git diff --name-only --diff-filter=U -z)

            if (( l10n_conflict_count > 0 )); then
              if ! node scripts/l10n/floorp-l10n-overlay.mjs resolve-merge --write --stage; then
                echo "Localization resolver rejected the merge; inspect the diagnostics artifact." \
                  >> "$GITHUB_STEP_SUMMARY"
                abort_merge
              fi
            fi

            if git ls-files -u | grep -q .; then
              echo "Unresolved merge entries remain after Floorp conflict handling." \
                >> "$GITHUB_STEP_SUMMARY"
              abort_merge
            fi
            git commit --no-edit
          fi

          restore_floorp_automation

          {
            echo "branch=${SYNC_BRANCH}"
            echo "protected_conflict_count=${protected_conflict_count}"
            echo "l10n_conflict_count=${l10n_conflict_count}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload merge diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: upstream-sync-conflicts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/upstream-sync-diagnostics
          if-no-files-found: ignore
          retention-days: 7

      - name: Reapply Floorp branding
        if: steps.check.outputs.has_changes == 'true'
        run: |
          ./scripts/rebrand-to-floorp.sh
          node scripts/l10n/floorp-l10n-overlay.mjs apply \
            --source-ref "upstream/$UPSTREAM_BRANCH" \
            --write
          node scripts/l10n/floorp-l10n-overlay.mjs verify \
            --source-ref "upstream/$UPSTREAM_BRANCH"

      - name: Verify generated changes
        if: steps.check.outputs.has_changes == 'true'
        id: verify
        run: |
          # Include newly generated, untracked files in validation and in the PR.
          git add -A
          git diff --cached --check
          file_count="$(git diff --cached --name-only | wc -l | tr -d ' ')"
          echo "file_count=${file_count}" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.check.outputs.has_changes == 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ env.FLOORP_BASE_BRANCH }}
          branch: ${{ steps.merge.outputs.branch }}
          delete-branch: true
          draft: always-true
          commit-message: "feat: sync upstream and re-apply Floorp branding"
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: GitHub <noreply@github.com>
          title: "Sync upstream Firefox iOS (${{ steps.check.outputs.commit_count }} commits)"
          body: |
            ## Upstream Sync

            This PR merges `mozilla-mobile/firefox-ios:main` into Floorp and reapplies the Floorp branding script.

            - Upstream commits: ${{ steps.check.outputs.commit_count }}
            - Upstream SHA: `${{ steps.check.outputs.upstream_sha }}`
            - Previous merge base: `${{ steps.check.outputs.merge_base }}`
            - Files changed by Floorp restoration and branding: ${{ steps.verify.outputs.file_count }}
            - Protected Floorp automation conflicts restored: ${{ steps.merge.outputs.protected_conflict_count }}
            - Localization conflicts resolved from the reviewed overlay: ${{ steps.merge.outputs.l10n_conflict_count }}
            - Other merge conflicts: none (unexpected conflicts abort with a diagnostics artifact)

            The `automation/upstream-sync` branch is generated. Manual edits will be replaced by the next sync run.

            Before merging:

            - [ ] Review unexpected upstream changes.
            - [ ] Confirm `Floorp iOS CI / Build and unit test` passes.
            - [ ] Check for newly introduced Firefox branding.

      - name: Dispatch CI for the sync branch
        if: >-
          steps.check.outputs.has_changes == 'true' &&
          (steps.create-pr.outputs.pull-request-operation == 'created' ||
          steps.create-pr.outputs.pull-request-operation == 'updated' ||
          (github.event_name == 'workflow_dispatch' && inputs.force_ci))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 2 \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" \
            --data "{\"ref\":\"${SYNC_BRANCH}\"}"
